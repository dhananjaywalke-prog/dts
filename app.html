  // ---------------- ASSIGNMENTS (partners/admin) ----------------
  async function asgData(force) {
    if (S.cache.asg && !force) return S.cache.asg;
    S.cache.asg = await EMS2.callAPI('initAssignments', {});
    return S.cache.asg;
  }
  const fmt0 = n => Math.round(+n||0).toLocaleString('en-IN');

  async function rAssignments() {
    if (!S.isPartner) { $('view').innerHTML = '<div class="card"><b>Partners/admin only.</b></div>'; return; }
    const d = await asgData(true);
    const rl = await EMS2.callAPI('realisation', {});
    const F = TSORT['asg'] = TSORT['asg']||{};
    const rows0 = d.rows || [];
    const partners = [...new Set(rows0.map(r=>r.Partner).filter(Boolean))].sort();
    const act = rows0.filter(r=>r.Status==='Active');
    const feesTot = rows0.reduce((s,r)=>s+(+r.Fees||0),0);
    const costTot = rows0.filter(r=>r.Fees!=null).reduce((s,r)=>s+(+r.Cost||0),0);
    const gtc = '1.2fr 130px 110px 110px 84px 84px 80px 80px 56px 86px 118px';
    const cols = [{k:'Client',l:'Client'},{k:'Service',l:'Service'},{k:'Partner',l:'Partner'},{k:'Manager',l:'Manager'},{k:'Due Date',l:'Due'},{k:'Created',l:'Created'},{k:'Fees',l:'Fees ₹',r:1},{k:'Cost',l:'Cost ₹',r:1},{k:'Rec',l:'Rec%',r:1},{k:'Status',l:'Status'},{l:''}];
    TBODY.asg = () => {
      let rows = rows0.map(r=>({ ...r, Rec: (r.Fees!=null && +r.Cost>0) ? Math.round(100*+r.Fees/+r.Cost) : null }));
      if (F.fstatus) rows = rows.filter(r=>r.Status===F.fstatus);
      if (F.fpartner) rows = rows.filter(r=>r.Partner===F.fpartner);
      rows = applySort('asg', tq('asg', rows), 'Created', 'desc');
      return rows.map(r=>{
        const a = r.Status==='Active';
        return `<div class="xr" style="grid-template-columns:${gtc};cursor:pointer${a?'':';background:#fbfcfe;color:var(--mut)'}" onclick="APP.asgView('${r['Row ID']}')">
          <div>${h(r.Client)}</div><div>${h(r.Service)}</div><div>${h(r.Partner||'—')}</div><div>${h(r.Manager||'—')}</div>
          <div style="color:var(--mut)">${r['Due Date']?fmtD(r['Due Date']):'—'}</div><div style="color:var(--mut)">${fmtD(r.Created)}</div>
          <div class="num">${r.Fees!=null?fmt0(r.Fees):'—'}</div><div class="num">${fmt0(r.Cost)}</div>
          <div class="num" style="color:${r.Rec==null?'var(--fog)':r.Rec>=100?'var(--ok)':'var(--bad)'}">${r.Rec==null?'—':r.Rec}</div>
          <div><span class="pill" style="background:${a?'var(--okbg)':'var(--line2)'};color:${a?'var(--ok)':'var(--mut)'}">${h(r.Status)}</span></div>
          <div style="white-space:nowrap" onclick="event.stopPropagation()">${a?`<button class="btn2" style="padding:2px 8px;font-size:11px" onclick='APP.asgForm(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn2" style="padding:2px 8px;font-size:11px;color:var(--goldd)" onclick="APP.asgClose('${r['Row ID']}')">Close</button>`:''}</div>
        </div>`;}).join('') || '<div style="padding:24px" class="sub">No assignments match.</div>';
    };
    const rlRows = (rl||[]).map(x=>`<div class="xr" style="grid-template-columns:1.4fr 90px 110px 110px 80px">
      <div>${h(x.Client)}</div><div class="num">${x.Assignments}</div><div class="num">${fmt0(x.Fees)}</div><div class="num">${fmt0(x.Cost)}</div>
      <div class="num" style="color:${x.Recovery==null?'var(--fog)':x.Recovery>=100?'var(--ok)':'var(--bad)'}">${x.Recovery==null?'—':x.Recovery+'%'}</div></div>`).join('');
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="card"><div style="font:800 22px Inter;color:var(--navy)">${act.length}</div><div class="sub">Active assignments</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--ok)">₹${fmt0(feesTot)}</div><div class="sub">Fees booked</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--goldd)">₹${fmt0(costTot)}</div><div class="sub">Cost on fee'd assignments</div></div>
      <div class="card"><div style="font:800 22px Inter;color:${costTot&&feesTot/costTot>=1?'var(--ok)':'var(--bad)'}">${costTot?Math.round(100*feesTot/costTot)+'%':'—'}</div><div class="sub">Overall recovery</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="h">Assignment register</span><span class="sub">fees &amp; cost visible to partners only · cost counts from creation date</span>
        <select style="width:120px;margin-left:12px" onchange="APP.fGo('asg','fstatus',this.value)"><option value="">Status: All</option>${['Active','Completed','Cancelled'].map(s=>`<option ${s===F.fstatus?'selected':''}>${s}</option>`).join('')}</select>
        <select style="width:150px" onchange="APP.fGo('asg','fpartner',this.value)"><option value="">Partner: All</option>${partners.map(x=>`<option ${x===F.fpartner?'selected':''}>${h(x)}</option>`).join('')}</select>
        <input id="q_asg" style="width:170px" placeholder="🔍 Search…" value="${h(F.q||'')}" oninput="APP.qGo('asg', this.value)">
        <span style="flex:1"></span>
        <button class="btn2" onclick="APP.asgCSVt()">⬇ Template</button>
        <button class="btn2" onclick="APP.asgCSVe()">⬇ Excel</button>
        <button class="btn2" onclick="document.getElementById('asg_file').click()">⬆ Import</button>
        <input type="file" id="asg_file" accept=".csv,text/csv" style="display:none" onchange="APP.asgImp(this)">
        <button class="btn" onclick="APP.asgForm()">+ New assignment</button>
      </div>
      <div class="xt">${thdr('asg', cols, gtc)}<div id="tb_asg">${TBODY.asg()}</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px"><span class="h">Realisation by client</span><span class="sub">fee'd assignments only · Recovery = Fees ÷ Cost</span></div>
      <div class="xt"><div class="xh" style="grid-template-columns:1.4fr 90px 110px 110px 80px;top:0"><div>Client</div><div style="text-align:right">Asgs</div><div style="text-align:right">Fees ₹</div><div style="text-align:right">Cost ₹</div><div style="text-align:right">Rec%</div></div>
      ${rlRows || '<div style="padding:24px" class="sub">Add fees to assignments to see realisation.</div>'}</div>
    </div>`;
  }

  function asgView(rowId) {
    const d = S.cache.asg || {};
    const r = (d.rows||[]).find(q=>String(q['Row ID'])===String(rowId)); if (!r) return;
    const rec = (r.Fees!=null && +r.Cost>0) ? Math.round(100*+r.Fees/+r.Cost)+'%' : '—';
    const body = FROW('Status', STP(r.Status==='Active'?'Approved':'Cancelled').replace('Approved',h(r.Status)).replace('Cancelled',h(r.Status))) +
      FROW('Client', h(r.Client)) + FROW('Service', h(r.Service)) +
      FROW('Partner', h(r.Partner)) + FROW('Manager', h(r.Manager)) +
      FROW('Due date', r['Due Date']?fmtD(r['Due Date']):'—') + FROW('Created', fmtD(r.Created)) +
      (r['Closed On']?FROW('Closed on', fmtD(r['Closed On'])):'') +
      FROW('Fees ₹', r.Fees!=null?fmt0(r.Fees):'— not set') + FROW('Cost to date ₹', fmt0(r.Cost)) + FROW('Recovery', rec) +
      FROW('Description', h(r.Description)) +
      FROW('Assignment ID', `<span style="font:500 10.5px ui-monospace,monospace;color:var(--fog)">${h(r['Row ID'])}</span>`);
    const acts = r.Status==='Active'
      ? `<div style="margin-top:12px;display:flex;gap:10px"><button class="btn" onclick='closeModalAnd(()=>APP.asgForm(${JSON.stringify(r).replace(/'/g,"&#39;")}))'>Edit</button><button class="btn2" style="color:var(--goldd)" onclick="closeModalAnd(()=>APP.asgClose('${r['Row ID']}'))">Close assignment</button></div>` : '';
    modal('Assignment — ' + h(r.Client), body + acts);
  }

  function asgForm(r) {
    const d = S.cache.asg || {}; const isEdit = !!r;
    modal(isEdit?'Edit assignment':'New assignment', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="grid-column:1/-1"><label class="sub">Client</label><input id="as_client" list="as_cl" value="${r?h(r.Client):''}" ${isEdit?'disabled':''} placeholder="type to search…"><datalist id="as_cl">${(d.clients||[]).map(c=>`<option>${h(c)}</option>`).join('')}</datalist></div>
        <div style="grid-column:1/-1"><label class="sub">Service</label><select id="as_service" ${isEdit?'disabled':''}><option value="">Service…</option>${(d.services||[]).map(s=>`<option ${r&&r.Service===s?'selected':''}>${h(s)}</option>`).join('')}</select></div>
        <div><label class="sub">Partner (locked at creation)</label><select id="as_partner" ${isEdit?'disabled':''}>${(d.partners||[]).map(x=>`<option ${(r?r.Partner:S.me['Employee Name'])===x?'selected':''}>${h(x)}</option>`).join('')}</select></div>
        <div><label class="sub">Manager (locked at creation)</label><select id="as_manager" ${isEdit?'disabled':''}><option value="">Manager…</option>${(d.managers||[]).map(x=>`<option ${r&&r.Manager===x?'selected':''}>${h(x)}</option>`).join('')}</select></div>
        <div><label class="sub">Due date</label><input type="date" id="as_due" value="${r?r['Due Date']||'':''}"></div>
        <div><label class="sub">Fees ₹ (editable until completion)</label><input type="number" id="as_fees" min="0" step="1" value="${r&&r.Fees!=null?r.Fees:''}"></div>
        <div style="grid-column:1/-1"><label class="sub">Description</label><input id="as_desc" value="${r?h(r.Description||''):''}"></div>
      </div>
      <div style="margin-top:14px"><button class="btn" id="as_save">${isEdit?'Update':'Create'}</button></div>`);
    $('as_save').onclick = async () => {
      const pl = { client: $('as_client').value.trim(), service: $('as_service').value,
        partner: $('as_partner').value, manager: $('as_manager').value,
        dueDate: $('as_due').value, fees: $('as_fees').value, description: $('as_desc').value.trim() };
      if (!isEdit && (!pl.client || !pl.service)) return toast('Pick client and service', true);
      if (!isEdit && !pl.manager) return toast('Pick the assignment manager', true);
      if (isEdit) pl.rowId = r['Row ID'];
      $('as_save').disabled = true;
      try { await EMS2.callAPI(isEdit?'updateAssignment':'createAssignment', pl); closeModal(); S.masters = null; toast(isEdit?'Updated ✓':'Assignment created ✓'); rAssignments(); }
      catch (e) { toast(e.message, true); $('as_save').disabled = false; }
    };
  }

  async function asgClose(rowId) {
    const st = confirm('OK = mark Completed · Cancel = keep it Active.\n(Choose Completed for finished work; use Edit for other changes.)') ? 'Completed' : null;
    if (!st) return;
    try { await EMS2.callAPI('updateAssignment', { rowId, status: st }); S.masters = null; toast('Closed ✓ — pair stays loggable for 7 days'); rAssignments(); }
    catch (e) { toast(e.message, true); }
  }

  function asgCSVt() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['Assignment ID,Client,Service,Partner,Manager,Due Date,Fees,Description,Status\n'], { type: 'text/csv' }));
    a.download = 'assignments-template.csv'; a.click();
    toast('Leave Assignment ID blank for NEW rows; keep it to UPDATE existing ones');
  }
  function asgCSVe() {
    const d = S.cache.asg || {};
    const heads = ['Assignment ID','Client','Service','Partner','Manager','Due Date','Fees','Description','Status','Created','Cost'];
    const key = { 'Assignment ID':'Row ID' };
    const esc = v => '"' + String(v??'').replace(/"/g,'""') + '"';
    const csv = [heads.join(',')].concat((d.rows||[]).map(r=>heads.map(k=>esc(r[key[k]||k])).join(','))).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'assignments.csv'; a.click();
    toast('Edit Due/Fees/Manager/Description/Status in Excel, keep Assignment ID, re-import to update');
  }
  function parseCSVtext(t) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (q) { if (ch === '"') { if (t[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (cell !== '' || row.length) { row.push(cell); rows.push(row); row = []; cell = ''; } if (ch === '\r' && t[i+1] === '\n') i++; }
      else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  async function asgImp(inp) {
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    const rows = parseCSVtext(await f.text());
    if (rows.length < 2) return toast('CSV has no data rows', true);
    const hd = rows[0].map(x=>x.trim().toLowerCase());
    const ix = k => hd.indexOf(k);
    if (ix('client') < 0 && ix('assignment id') < 0) return toast('CSV needs a Client column (new rows) or Assignment ID column (updates)', true);
    const g = (r,k) => ix(k) >= 0 ? (r[ix(k)]||'').trim() : '';
    const items = rows.slice(1).filter(r=>r.join('').trim()).map((r,i)=>({
      line: i+2, rowId: g(r,'assignment id'),
      client: g(r,'client'), service: g(r,'service'), partner: g(r,'partner'), manager: g(r,'manager'),
      dueDate: g(r,'due date'), fees: g(r,'fees'), description: g(r,'description'),
      status: (s=>['Active','Completed','Cancelled'].includes(s)?s:'')(g(r,'status')) }));
    const nUpd = items.filter(x=>x.rowId).length, nNew = items.length - nUpd;
    modal('Import assignments', `<div style="font:500 12.5px Inter;line-height:1.6">${items.length} row(s) parsed → <b>${nUpd} update(s)</b> (rows with an Assignment ID — blank cells are left unchanged) and <b>${nNew} new</b> assignment(s).</div><div style="margin-top:12px"><button class="btn" id="as_imp_go">Apply</button></div><div id="as_imp_st" class="sub" style="margin-top:8px"></div>`);
    $('as_imp_go').onclick = async () => {
      $('as_imp_go').disabled = true;
      let ok = 0; const errs = [];
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        $('as_imp_st').textContent = 'Applying ' + (i+1) + ' / ' + items.length + '…';
        try {
          if (it.rowId) {
            const pl = { rowId: it.rowId };
            for (const k of ['partner','manager','dueDate','fees','description','status']) if (it[k]) pl[k] = it[k];
            if (Object.keys(pl).length === 1) throw new Error('nothing to update');
            await EMS2.callAPI('updateAssignment', pl);
          } else {
            await EMS2.callAPI('createAssignment', it);
          }
          ok++;
        } catch (e) { errs.push('Row ' + it.line + ': ' + e.message); }
      }
      closeModal(); S.masters = null;
      toast('Applied ' + ok + ' of ' + items.length + (errs.length ? ' — ' + errs.length + ' failed' : ' ✓'), errs.length > 0);
      if (errs.length) alert('Import issues:\n' + errs.slice(0, 12).join('\n'));
      rAssignments();
    };
  }

  const RENDER = { myday:rMyday, dashboard:rDashboard, approvals:rApprovals, review:rReview, assignments:rAssignments, timesheet:rTimesheet, workplan:rWorkplan, leave:rLeave, expenses:rExpenses };

  async function signout() { await EMS2.signOut(); location.replace('home.html?next=app'); }

  boot();
  return { show, signout, quickLog, logPlan, tsPopup, actGo, openAppr, selAppr, bulkApprove, rfshAppr, tsortGo: tsort, qGo, fGo, exForm, exMonthGo, rtSort, rtCSV, tsEdit, tsDel, wpForm, wpEnd, wpDel, wpNew, wpTabGo, tpForm, vizGo, vizEmpGo, vizCliGo, lvEdit, lvCancel, coCancel, exCancel, viewBill, exHint, exView, lvView, wpView, rtView, asgView, asgForm, asgClose, asgCSVt, asgCSVe, asgImp, S, RENDER, masters, h, fmt1, toast, $ };
})();
</script>
