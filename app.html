<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeWise EMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#102a43; --navy8:#243b53; --ink:#243b53; --mut:#627d98; --fog:#829ab1; --line:#e3e9ef; --line2:#eef2f6; --bg:#f7f9fb; --gold:#d4a853; --goldd:#8f6b1e; --goldbg:#fdf6e6; --goldline:#ecd9a8; --ok:#1f7a4d; --okbg:#e6f4ea; --bad:#b3261e; --badbg:#fdecec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; font-size:14px; color:var(--ink); background:var(--bg); }
  #shell { display:flex; min-height:100vh; }
  /* sidebar */
  #side { width:216px; background:var(--navy); color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; flex:none; }
  #side .brand { padding:18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08); }
  #side .brand img { height:36px; filter:brightness(0) invert(1); opacity:.95; display:block; }
  #side .brand .bar { height:24px; width:1px; background:rgba(255,255,255,.25); }
  #side .brand b { font-size:12px; font-weight:700; }
  #nav { padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .nitem { display:flex; align-items:center; gap:10px; padding:9px 12px; border:0; border-left:3px solid transparent; border-radius:0 8px 8px 0; background:none; color:rgba(255,255,255,.72); font:500 13px Inter; cursor:pointer; text-align:left; width:100%; }
  .nitem:hover { color:#fff; background:rgba(255,255,255,.05); }
  .nitem.on { background:rgba(212,168,83,.16); border-left-color:var(--gold); color:#fff; font-weight:600; }
  .nitem .bdg { margin-left:auto; background:var(--gold); color:var(--navy); font:700 10px Inter; padding:1px 7px; border-radius:999px; }
  .nitem .dot { margin-left:auto; width:8px; height:8px; border-radius:50%; background:#e66a5b; }
  #side .foot { margin-top:auto; padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; }
  #side .foot .av { width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center; font:700 12px Inter; flex:none; }
  #side .foot button { background:none; border:0; color:rgba(255,255,255,.45); cursor:pointer; font-size:15px; }
  /* topbar + main */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #top { height:56px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 24px; position:sticky; top:0; z-index:40; }
  #top h1 { font:700 15px Inter; color:var(--navy); margin:0; }
  #top .date { font:500 12px Inter; color:var(--mut); }
  #view { flex:1; padding:20px 24px; }
  /* primitives */
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .h { font:700 13px Inter; color:var(--navy); }
  .sub { font:500 11px Inter; color:var(--mut); }
  .btn { background:var(--navy); color:#fff; border:0; border-radius:8px; font:600 12px Inter; padding:8px 16px; cursor:pointer; }
  .btn:hover { background:var(--navy8); }
  .btn[disabled] { opacity:.55; cursor:default; }
  .btn2 { background:#fff; color:var(--navy); border:1px solid #d9e2ec; border-radius:8px; font:600 12px Inter; padding:7px 12px; cursor:pointer; }
  .btn2:hover { border-color:var(--gold); }
  .pill { font:600 10px Inter; padding:1px 8px; border-radius:999px; }
  input, select, textarea { font:500 12.5px Inter; color:var(--ink); border:1px solid #d9e2ec; border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,168,83,.15); }
  .grid { display:grid; gap:12px; }
  .skel { background:linear-gradient(90deg,#eef2f6 25%,#f7f9fb 50%,#eef2f6 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:8px; }
  @keyframes sk { from{background-position:200% 0} to{background-position:-200% 0} }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--navy); color:#fff; font:500 12.5px Inter; padding:10px 16px; border-radius:10px; box-shadow:0 8px 30px rgba(16,42,67,.35); z-index:99; }
  .toast.err { background:var(--bad); }
  /* excel-style table */
  .xt { font:500 12.5px Inter; }
  .xt .xh { display:grid; background:#f0f4f8; border-bottom:1px solid #d9e2ec; font:600 11px Inter; color:#486581; text-transform:uppercase; letter-spacing:.04em; position:sticky; top:56px; z-index:30; }
  .xt .xh > div { padding:8px 10px; cursor:pointer; user-select:none; white-space:nowrap; }
  .xt .xh > div:hover { color:var(--navy); }
  .xt .xr { display:grid; border-bottom:1px solid var(--line2); height:32px; align-items:center; }
  .xt .xr:nth-child(even) { background:#fbfcfe; }
  .xt .xr:hover { background:var(--goldbg); }
  .xt .xr > div { padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .num { text-align:right; font-weight:600; }
  @media (max-width: 900px) { #side{width:64px} #side .brand b,#side .brand .bar,#side .foot div,#nav .lbl{display:none} #view{padding:12px} }
</style>
</head>
<body>
<div id="shell">
  <div id="side">
    <div class="brand"><img src="https://drpca.com/assets/drpca-logo.png" alt="DRP" onerror="this.outerHTML='<b style=color:#d4a853>drp&amp;co.</b>'"><div class="bar"></div><b>TimeWise</b></div>
    <div id="nav"></div>
    <div class="foot"><div class="av" id="uAv">··</div><div style="flex:1;min-width:0"><div id="uName" style="font:600 12px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">…</div><div id="uRole" style="font:500 10px Inter;color:rgba(255,255,255,.45)"></div></div><button title="Sign out" onclick="APP.signout()">⎋</button></div>
  </div>
  <div id="main">
    <div id="top"><h1 id="vTitle">…</h1><div class="date" id="vDate"></div><div style="margin-left:auto;display:flex;gap:10px;align-items:center"><button class="btn" onclick="APP.quickLog()">+ Log time</button></div></div>
    <div id="view"><div class="skel" style="height:200px;margin-top:10px"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
'use strict';
const APP = (() => {
  const S = { me:null, isApprover:false, isAdmin:false, view:null, cache:{}, masters:null, myday:null };
  const $ = id => document.getElementById(id);
  const h = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt1 = n => (Math.round((+n||0)*100)/100).toLocaleString('en-IN');
  const IST_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtD(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'-'+MONS[+m[2]-1]+'-'+m[1].slice(2) : h(iso||''); }
  function fmtM(ym){ const m=String(ym||'').match(/^(\d{4})-(\d{2})/); return m ? MONS[+m[2]-1]+'-'+m[1].slice(2) : h(ym||''); }
  function sane(t){ t=String(t||'').trim(); if(t.length<10) return false; const w=t.split(/\s+/); return w.length>=5 && w.filter(x=>/[A-Za-z]{3,}/.test(x)).length>=3; }
  const SANE_HINT = 'meaningful sentence: 10+ characters, 5+ real words';
  const TSORT = {};
  const VIEW_OF = { exp:'expenses', apl:'approvals', apx:'approvals', tsm:'timesheet', apc:'approvals', lvt:'leave', cot:'leave', wpt:'workplan', tpt:'workplan', asg:'assignments' };
  const TBODY = {};
  function addDaysIso(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function tsort(view, col){ const s=TSORT[view]=TSORT[view]||{}; if(s.col===col) s.dir=s.dir==='asc'?'desc':'asc'; else { s.col=col; s.dir='asc'; } RENDER[VIEW_OF[view]||view](); }
  function fGo(view, key, val){ (TSORT[view]=TSORT[view]||{})[key]=val; RENDER[VIEW_OF[view]||view](); }
  let _qdeb; function qGo(view, val){ const s=(TSORT[view]=TSORT[view]||{}); s.q=val.trim(); clearTimeout(_qdeb); _qdeb=setTimeout(()=>{ const tb=document.getElementById('tb_'+view); if (tb && TBODY[view]) tb.innerHTML = TBODY[view](); },200); }
  function tq(view, rows){ const q=(TSORT[view]&&TSORT[view].q||'').toLowerCase(); return q ? rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)) : rows; }
  function applySort(view, rows, defCol, defDir){ const s=TSORT[view]||{}; const col=s.col||defCol, dir=s.col?s.dir:(defDir||'asc'); const isD=v=>/^\d{4}-\d{2}/.test(String(v)); return rows.slice().sort((a,b)=>{ let x=a[col], y=b[col]; const nx=parseFloat(x), ny=parseFloat(y); if(isD(x)&&isD(y)){ x=String(x); y=String(y); } else if(!isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!==''){ x=nx; y=ny; } else { x=String(x??'').toLowerCase(); y=String(y??'').toLowerCase(); } return (x<y?-1:x>y?1:0)*(dir==='asc'?1:-1); }); }
  function thdr(view, cols, gtc, top){ const s=TSORT[view]||{}; return `<div class="xh" style="grid-template-columns:${gtc};top:${top||0}">` + cols.map(c=>`<div ${c.k?`onclick=\"APP.tsortGo('${view}','${c.k}')\"`:''} style="${c.r?'text-align:right;':''}${s.col===c.k?'color:var(--navy);':''}">${c.l}${c.k?(s.col===c.k?(s.dir==='asc'?' ▲':' ▼'):' ↕'):''}</div>`).join('') + '</div>'; }

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err?' err':''); t.textContent = msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2600);
  }

  // ---------------- boot ----------------
  async function boot() {
    const email = await EMS2.getAuthedEmail();
    if (!email) { location.replace('home.html?next=app'); return; }
    try {
      const d = await EMS2.callAPI('myday', {});   // rpc api_myday
      S.myday = d; S.me = d.employee; S.isApprover = !!d.isApprover;
      S.isAdmin = (d.employee && d.employee['Role']) === 'admin';
      S.isPartner = S.isAdmin || /partner/i.test((d.employee && d.employee['Designation']) || '');
      $('uName').textContent = S.me['Employee Name'] || email;
      $('uRole').textContent = (S.me['Designation']||'') + (S.isAdmin?' · Admin':S.isApprover?' · Approver':'') + ' · b18';
      $('uAv').textContent = (S.me['Employee Name']||email).split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      buildNav();
      const hv = (location.hash || '').slice(1);
      show(RENDER[hv] ? hv : (S.isApprover ? 'dashboard' : 'myday'));
    } catch (e) {
      $('view').innerHTML = '<div class="card" style="margin-top:20px"><b>Could not load.</b><div class="sub" style="margin-top:6px">'+h(e.message)+'</div><button class="btn" style="margin-top:12px" onclick="location.reload()">Retry</button></div>';
    }
  }

  // ---------------- nav ----------------
  const VIEWS = () => [
    S.isApprover && { id:'dashboard', icon:'📊', label:'Dashboard' },
    S.isApprover && { id:'approvals', icon:'✅', label:'Approvals', badge:()=>S.cache.dashboard?( (S.cache.dashboard.approvals.leaves.length + S.cache.dashboard.approvals.expenses.length + (S.cache.dashboard.approvals.compOffs||[]).length) || null):null },
    { id:'review', icon:'🔎', label:'Review' },
    S.isPartner && { id:'assignments', icon:'📁', label:'Assignments' },
    { id:'myday', icon:'☀️', label:'My Day', dot:()=>missingYday() },
    { id:'timesheet', icon:'🗓', label:'Timesheet' },
    { id:'workplan', icon:'📋', label:'Work Plan' },
    { id:'leave', icon:'🌴', label:'Leave' },
    { id:'expenses', icon:'💳', label:'Expenses' },
    S.isAdmin && { id:'admin', icon:'⚙️', label:'Admin', href:'admin.html' }
  ].filter(Boolean);

  function missingYday() {
    const w = S.myday && S.myday.week; if (!w || w.length < 2) return false;
    const y = w[w.length-2];
    return !y.isSunday && !y.isHoliday && (+y.hours||0) === 0;
  }

  function buildNav() {
    $('nav').innerHTML = VIEWS().map(v => v.href
      ? `<a class="nitem" style="text-decoration:none" href="${v.href}"><span>${v.icon}</span><span class="lbl">${v.label}</span></a>`
      : `<button class="nitem${S.view===v.id?' on':''}" onclick="APP.show('${v.id}')"><span>${v.icon}</span><span class="lbl">${v.label}</span>${v.badge&&v.badge()?`<span class="bdg">${v.badge()}</span>`:''}${v.dot&&v.dot()?'<span class="dot"></span>':''}</button>`
    ).join('');
  }

  const TITLES = { myday:'My Day', dashboard:'Dashboard', approvals:'Approvals', review:'Review', assignments:'Assignments', timesheet:'Timesheet', workplan:'Work Plan', leave:'Leave', expenses:'Expenses' };

  async function show(id) {
    S.view = id; buildNav();
    $('vTitle').textContent = TITLES[id] || id;
    $('vDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    $('view').innerHTML = '<div class="grid" style="grid-template-columns:2fr 1fr;margin-top:4px"><div class="skel" style="height:180px"></div><div class="skel" style="height:180px"></div></div>';
    try { history.replaceState(null, '', '#' + id); await RENDER[id](); } catch (e) { $('view').innerHTML = '<div class="card"><b>Error:</b> '+h(e.message)+' <button class="btn2" onclick="APP.show(\''+id+'\')">Retry</button></div>'; }
  }

  // masters (assignments etc.) cached for quick entry
  async function masters(force) {
    if (S.masters && !force) return S.masters;
    S.masters = await EMS2.callAPI('initTimesheet', {});
    return S.masters;
  }

  // ---------------- MY DAY ----------------
  async function rMyday() {
    const d = S.myday = await EMS2.callAPI('myday', {});
    const t = d.today, wk = d.week || [];
    const planned = (t.planned||[]).filter(p=>!p.logged);
    const pct = Math.min(100, Math.round(100*(+t.loggedTotal||0)/6));
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:1.4fr 1fr">
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px"><span class="h">Today</span>
          <span class="sub">${fmt1(t.loggedTotal)}h logged of 6h${t.loggedTotal<6?' · '+fmt1(6-t.loggedTotal)+'h to go':''}</span>
          <button class="btn" style="margin-left:auto;padding:6px 12px" onclick="APP.quickLog()">+ Add entry</button></div>
        <div style="margin-top:10px;height:10px;background:var(--line2);border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${t.loggedTotal>=6?'var(--ok)':'var(--gold)'}"></div></div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          ${(t.entries||[]).map(e=>`<div style="display:flex;align-items:center;gap:10px;font:500 12px Inter">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none"></span>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(e.Client)} — ${h(e.Task)} · <b>${fmt1(e.Hours)}h</b>${e.Location?' · '+h(e.Location):''}</span></div>`).join('') || '<div class="sub">Nothing logged yet today — click a day below or + Add entry.</div>'}
          ${planned.map(p=>`<div style="display:flex;align-items:center;gap:10px;font:500 12px Inter;color:var(--goldd);background:var(--goldbg);border:1px dashed var(--goldline);border-radius:8px;padding:7px 10px">
            ⚠️ Planned, not logged: ${h(p.client)} — ${h(p.task)} · ${fmt1(p.hours)}h
            <button class="btn" style="margin-left:auto;padding:4px 10px;font-size:11px" onclick='APP.logPlan(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Log it</button></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="h" style="margin-bottom:10px">My month</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div><div style="font:800 20px Inter;color:var(--navy)">${fmt1(d.month.hours)}</div><div class="sub">hours logged</div></div>
          <div><div style="font:800 20px Inter;color:var(--ok)">${fmt1(d.month.billablePct)}%</div><div class="sub">billable</div></div>
          <div><div style="font:800 20px Inter;color:var(--goldd)">${fmt1(d.plBalance)}</div><div class="sub">PL balance</div></div>
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;font:500 12px Inter">
          ${(d.pendings.leaves||[]).map(l=>`<div>🌴 ${h(l['Leave Type'])} ${fmtD(l['From Date'])} → ${fmtD(l['To Date'])} — <b style="color:${l.Status==='Approved'?'var(--ok)':'var(--goldd)'}">${h(l.Status)}</b></div>`).join('') || '<div class="sub">No upcoming leaves.</div>'}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px"><span class="h">Last 7 days</span><span class="sub">ending today · click a day to add or edit entries</span>
        <span style="margin-left:auto" class="sub"><b style="color:var(--ok)">${fmt1(wk.reduce((s,x)=>s+(+x.hours||0),0))}h</b> logged</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
        ${wk.map(x=>{
          const off = x.isSunday || x.isHoliday;
          const bg = x.isToday ? 'var(--goldbg);border:1px solid var(--goldline)' : off ? 'var(--line2)' : (+x.hours>=6 ? 'var(--okbg)' : +x.hours>0 ? 'var(--badbg)' : '#f1f5f9');
          const col = x.isToday ? 'var(--goldd)' : off ? 'var(--fog)' : +x.hours>=6 ? 'var(--ok)' : +x.hours>0 ? 'var(--bad)' : 'transparent';
          return `<div onclick="APP.tsPopup('${x.date}')" style="text-align:center;cursor:pointer">
            <div style="height:52px;background:${bg};border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px Inter;color:${col}">${off?'🏖':(+x.hours?fmt1(x.hours):'')}</div>
            <div style="font:600 10.5px Inter;color:${x.isToday?'var(--navy)':'var(--ink)'};margin-top:4px">${fmtD(x.date).slice(0,6)}</div>
            <div style="font:500 10px Inter;color:var(--fog)">${x.dayName}${x.isToday?' · today':''}</div>
          </div>`;
        }).join('')}
      </div>
    </div>` + vizShell('u', 'My analytics');
    buildNav();
  }

  // quick entry (shared by My Day and modal)
  async function tsPopup(dateStr, pre) {
    closeModal();
    const m = await masters();
    const todayStr = S.myday.today.date;
    const isEdit = !!(pre && pre.rowId);
    const locked = dateStr < addDaysIso(todayStr, -7);
    const future = dateStr > todayStr;
    const dayRows = (m.timesheets||[]).filter(e=>e.Date===dateStr);
    const tot = dayRows.reduce((s,e)=>s+(+e.Hours||0),0);
    const asg = m.assignments||[];
    const clientsArr = [...new Set(asg.map(a=>a['Client Name']))].sort();
    const lastLoc = localStorage.getItem('ems2_lastloc')||'';
    const locSel = (pre && pre.location) || lastLoc;
    const rowsHtml = dayRows.map(e=>{
      const ed = !e.Auto && !locked && !future;
      return `<div style="display:flex;align-items:center;gap:8px;font:500 12px Inter;padding:6px 8px;border:1px solid var(--line2);border-radius:8px${isEdit&&e['Row ID']===pre.rowId?';background:var(--goldbg)':''}">
        <span style="min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(e.Client)} — ${h(e.Task)} · <b>${fmt1(e.Hours)}h</b>${e.Location?' · '+h(e.Location):''}</span>
        ${ed?`<button class="btn2" style="padding:2px 8px;font-size:11px" onclick='APP.tsEdit(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button><button class="btn2" style="padding:2px 8px;font-size:11px;color:var(--bad)" onclick="APP.tsDel('${e['Row ID']}')">Del</button>`:''}
      </div>`;
    }).join('');
    const formHtml = (locked||future)
      ? `<div class="sub" style="margin-top:10px">${locked?'Entries older than 7 days are locked.':'Future dates cannot be logged.'}</div>`
      : `<div style="margin-top:12px;border-top:1px solid var(--line2);padding-top:12px">
        <div class="h" style="font-size:13px;margin-bottom:8px">${isEdit?'Edit entry':'Add entry'}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><label class="sub">Location</label><select id="tp_loc"><option value="">📍 Location…</option>${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${l===locSel?'selected':''}>${l}</option>`).join('')}</select></div>
          <div><label class="sub">Client</label><select id="tp_client"><option value="">Client…</option>${clientsArr.map(c=>`<option ${pre&&pre.client===c?'selected':''}>${h(c)}</option>`).join('')}</select></div>
          <div><label class="sub">Task</label><select id="tp_task"><option value="">Task…</option></select></div>
          <div><label class="sub">Hours</label><input id="tp_hours" type="number" step="0.5" min="0.5" max="24" value="${(pre&&pre.hours)||''}"></div>

      const desc = $('tp_desc').value.trim();

    const it = (list||[]).find(x=>String(x['Row ID'])===String(id)); if (!it) return;
    const F = (l,v)=>`<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="sub" style="width:140px;flex:none">${l}</span><span style="font:500 12.5px Inter;min-width:0">${v||'—'}</span></div>`;
    const body = kind==='leave'
      ? F('Employee',h(it['Employee Name']))+F('Type',h(it['Leave Type']))+F('Day type',h(it['Day Type']))+F('From',fmtD(it['From Date']))+F('To',fmtD(it['To Date']))+F('Working days',fmt1(it['Total Days']))+F('Paid / LOP',fmt1(it['Paid Days']||0)+' / '+fmt1(it['LOP Days']||0))+F('Reason',h(it.Reason))+F('Applied on',h(it['Applied On']))
      : kind==='compoff'
      ? F('Employee',h(it['Employee Name']))+F('Worked on',fmtD(it.Date))+F('Day type',h(it['Day Type']))+F('Credit',fmt1(it.Credit)+' day(s)')+F('Client',h(it.Client))+F('Task',h(it.Task))+F('Hours logged that day',fmt1(it['Hours Logged'])+'h')+F('Reason',h(it.Reason))+F('Applied on',h(it['Applied On']))
      : F('Employee',h(it['Employee Name']))+F('Date',fmtD(it.Date))+F('Type',h(it['Expense Type']))+F('Amount','₹'+fmt1(it.Amount))+F('Client',h(it['Client Name']))+F('Reimbursement by',h(it['Reimbursement By']))+F('Receipt ref',h(it['Receipt Reference']))+F('Bill copy', it['Receipt File']?`<a href="#" onclick="APP.viewBill('${h(it['Receipt File'])}');return false" style="font-weight:600">📎 View bill</a>`:'Not attached')+F('Description',h(it.Description))+F('Submitted on',h(it['Submitted On']))+`<div style="display:flex;gap:8px;padding:8px 0 2px;align-items:center"><span class="sub" style="width:140px;flex:none">Approve amount ₹</span><input type="number" id="ap_amt" min="1" step="0.01" max="${it.Amount}" value="${it.Amount}" style="width:140px"><span class="sub">claimed ₹${fmt1(it.Amount)} · lower needs a comment</span></div>`;
    const lvDates = kind==='leave' ? `<div style="display:flex;gap:10px;align-items:end;margin-top:10px;background:var(--goldbg);border:1px solid var(--goldline);border-radius:8px;padding:8px 10px"><div><label class="sub">Approve From</label><input type="date" id="ap_from" value="${it['From Date']}" style="width:150px"></div><div><label class="sub">Approve To</label><input type="date" id="ap_to" value="${it['To Date']}" style="width:150px"></div><span class="sub" style="padding-bottom:8px">change dates to approve a modified period — comment required; days &amp; paid/LOP recompute</span></div>` : '';
    modal((kind==='leave'?'Leave':kind==='compoff'?'Comp-off claim':'Expense')+' — review', body + lvDates +

        <button class="btn" style="background:var(--bad)" onclick="APP.actGo('${kind}','reject','${id}')">✕ Reject</button>
      </div>`);
  }

  async function actGo(kind, what, id) {
    const cEl = $('ap_cmt');
    const comments = (cEl && cEl.value.trim()) || '';
    if (what==='reject' && !sane(comments)) return toast('Rejection needs a ' + SANE_HINT, true);
    let approvedAmount = '';
    const amtEl = $('ap_amt');
    if (what==='approve' && kind==='expense' && amtEl) {
      approvedAmount = amtEl.value;
      const claimed = +amtEl.getAttribute('max');
      if (!(+approvedAmount > 0)) return toast('Enter a valid approved amount', true);
      if (+approvedAmount > claimed) return toast('Approved amount cannot exceed claimed ₹' + fmt1(claimed), true);
      if (+approvedAmount < claimed && !sane(comments)) return toast('Approving less than claimed needs a ' + SANE_HINT + ' so the person knows why', true);
    }
    let fromDate = '', toDate = '';
    const fEl = $('ap_from'), tEl = $('ap_to');
    if (what==='approve' && kind==='leave' && fEl && tEl) {
      const list = (S.cache.dashboard && S.cache.dashboard.approvals.leaves) || [];
      const orig = list.find(x=>String(x['Row ID'])===String(id)) || {};
      if (fEl.value !== orig['From Date'] || tEl.value !== orig['To Date']) {
        fromDate = fEl.value; toDate = tEl.value;
        if (!fromDate || !toDate || toDate < fromDate) return toast('Invalid modified date range', true);
        if (!sane(comments)) return toast('Approving modified dates needs a ' + SANE_HINT + ' so the person knows why', true);
      }
    }
    closeModal();
    try {
      await EMS2.callAPI((what==='approve'?'approve':'reject')+(kind==='leave'?'Leave':kind==='compoff'?'CompOff':'Expense'),
        { rowId: id, approverEmail: S.me['Employee Email'], approverName: S.me['Employee Name'], comments, approvedAmount, fromDate, toDate });
      toast((what==='approve'?'Approved':'Rejected')+' ✓');
      delete BULK[kind][id];
      await dashData(true); buildNav(); RENDER[S.view]();
    } catch (e) { toast(e.message, true); }
  }

  function selAppr(kind, id, on) { if (on) BULK[kind][id] = 1; else delete BULK[kind][id]; RENDER.approvals(); }

  async function bulkApprove(kind) {
    const ids = Object.keys(BULK[kind]);
    if (!ids.length) return;
    if (!confirm('Approve ' + ids.length + ' selected ' + (kind==='leave'?'leave(s)':kind==='compoff'?'comp-off claim(s)':'expense(s)') + '?')) return;
    let ok = 0;
    for (const id of ids) {
      try {
        await EMS2.callAPI('approve'+(kind==='leave'?'Leave':kind==='compoff'?'CompOff':'Expense'),
          { rowId: id, approverEmail: S.me['Employee Email'], approverName: S.me['Employee Name'], comments: '' });
        ok++;
      } catch (e) { toast(e.message, true); }
    }
    BULK[kind] = {};
    toast('Approved ' + ok + ' of ' + ids.length);
    await dashData(true); buildNav(); RENDER[S.view]();
  }

  async function tpRawGet(force) {
    if (S.cache.tpRaw && !force) return S.cache.tpRaw;
    const c = await EMS2.ready;
    const r = await c.rpc('api_initworkplandashboard', { p: {} });
    if (r.error) throw new Error(r.error.message);
    S.cache.tpRaw = r.data;
    return r.data;

  function wpDates30(startIso, holMap, leaves) {
    const ds = [];
    for (let i = 0; i < 30; i++) {
      const iso = addDaysIso(startIso, i);
      const dt = new Date(iso + 'T00:00:00');
      ds.push({ iso, dayNum: dt.getDate(), dayName: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()],
        mon: fmtD(iso).slice(3,6), isSun: dt.getDay()===0, hol: holMap[iso]||null,
        leave: (leaves||[]).some(l=>iso>=l.fromDate && iso<=l.toDate) });
    }
    return ds;
  }

  function wpEntriesOn(rows, d) {
    if (d.leave) return [];
    return rows.filter(w => d.iso >= w['From Date'] && d.iso <= w['To Date']
      && (w['Include Off Days']==='Yes' || !(d.isSun || d.hol)));
  }

  async function rTeamPlan(tabBtns) {
    const raw = await tpRawGet(true);
    const todayStr = raw.today;
    const F = TSORT['tpt'] = TSORT['tpt']||{};
    let rows = raw.teamRows || [];
    const emps = [...new Set(rows.map(w=>w['Employee Name']).filter(Boolean))].sort();
    const clis = [...new Set(rows.map(w=>w.Client).filter(Boolean))].sort();
    const bys  = [...new Set(rows.map(w=>w['Planned By']||'Self'))].sort();
    if (F.femp) rows = rows.filter(w=>w['Employee Name']===F.femp);
    if (F.fclient) rows = rows.filter(w=>w.Client===F.fclient);
    if (F.floc) rows = rows.filter(w=>w.Location===F.floc);
    if (F.fby) rows = rows.filter(w=>(w['Planned By']||'Self')===F.fby);
    rows = tq('tpt', rows);
    const globalHol = {}, persHol = {};
    (raw.holidays||[]).forEach(hd=>{ const sc=String(hd['Employee Email']||'All'); if(/^all$/i.test(sc)) globalHol[hd.Date]=hd.Description||'Holiday'; else { const k=sc.toLowerCase(); (persHol[k]=persHol[k]||{})[hd.Date]=1; } });
    const lvByEmail = {};
    (raw.leaves||[]).forEach(l=>{ const k=String(l.email||'').toLowerCase(); (lvByEmail[k]=lvByEmail[k]||[]).push(l); });
    const dates = wpDates30(todayStr, globalHol, []);
    const byEmp = {};
    rows.forEach(w=>{ const k=w['Employee Name']||'?'; (byEmp[k]=byEmp[k]||{email:String(w['Employee Email']||'').toLowerCase(), rows:[]}).rows.push(w); });
    const gridRows = Object.keys(byEmp).sort().map(name=>{
      const em = byEmp[name].email, ers = byEmp[name].rows;
      const myLv = lvByEmail[em]||[], ph = persHol[em]||{};
      const cells = dates.map(x=>{
        const onLv = myLv.some(l=>x.iso>=l.fromDate && x.iso<=l.toDate);
        const off = x.isSun || x.hol || ph[x.iso];
        const ens = onLv ? [] : ers.filter(w=>x.iso>=w['From Date'] && x.iso<=w['To Date'] && (w['Include Off Days']==='Yes' || !off));
        const tot = ens.reduce((s,w)=>s+(+w['Daily Hours']||0),0);
        const bg = onLv ? 'var(--badbg)' : off ? 'var(--line2)' : tot>=6 ? 'var(--okbg)' : tot>0 ? 'var(--goldbg)' : '#fff';
        const fg = onLv ? 'var(--bad)' : tot>=6 ? 'var(--ok)' : tot>0 ? 'var(--goldd)' : 'transparent';
        const tip = onLv ? 'On leave' : ens.map(w=>w.Client+' — '+w.Task+' · '+fmt1(w['Daily Hours'])+'h'+(w['Planned By']?' (by '+w['Planned By']+')':'')).join('\n');
        return `<div title="${h(tip)}" style="height:26px;border-right:1px solid var(--line2);background:${bg};display:flex;align-items:center;justify-content:center;font:700 10px Inter;color:${fg}">${onLv?'🏖':(tot?fmt1(tot):'')}</div>`;
      }).join('');
      return `<div style="display:grid;grid-template-columns:150px repeat(30,30px);border-bottom:1px solid var(--line2)"><div style="padding:4px 8px;font:600 11px Inter;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h(name)}</div>${cells}</div>`;
    }).join('');
    const gridHead = `<div style="display:grid;grid-template-columns:150px repeat(30,30px);border-bottom:1px solid #d9e2ec;background:#f0f4f8;position:sticky;top:0"><div style="padding:4px 8px;font:600 10px Inter;color:#486581">TEAM × 30 DAYS</div>${dates.map(x=>`<div style=\"text-align:center;font:600 9px Inter;color:${x.isSun||x.hol?'#2563EB':'var(--mut)'};padding:2px 0\" title=\"${h(x.hol||'')}\">${x.dayNum}<br>${x.dayName.slice(0,2)}</div>`).join('')}</div>`;
    const gtc = '140px 1fr 130px 88px 88px 46px 96px 110px 1.1fr 150px';
    const cols = [{k:'Employee Name',l:'Employee'},{k:'Client',l:'Client'},{k:'Task',l:'Task'},{k:'From Date',l:'From'},{k:'To Date',l:'To'},{k:'Daily Hours',l:'h/d',r:1},{k:'Location',l:'Location'},{k:'Planned By',l:'Planned By'},{k:'Description',l:'Description'},{l:''}];
    TBODY.tpt = () => applySort('tpt', rows, 'From Date', 'asc').map(w=>{
      const fut = w['From Date'] >= todayStr, inprog = !fut && w['To Date'] >= todayStr;
      const acts = fut
        ? `<button class="btn2" style="padding:2px 8px;font-size:11px" onclick='APP.wpForm(${JSON.stringify(w).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn2" style="padding:2px 8px;font-size:11px;color:var(--bad)" onclick="APP.wpDel('${w['Row ID']}')">Del</button>`
        : inprog ? `<button class="btn2" style="padding:2px 8px;font-size:11px" onclick='APP.wpForm(${JSON.stringify(w).replace(/'/g,"&#39;")},"revise")'>Revise</button> <button class="btn2" style="padding:2px 8px;font-size:11px;color:var(--goldd)" onclick="APP.wpEnd('${w['Row ID']}')">End</button>` : '';
      return `<div class="xr" style="grid-template-columns:${gtc}">
        <div>${h(w['Employee Name'])}</div><div>${h(w.Client)}</div><div>${h(w.Task)}</div>
        <div style="color:var(--mut)">${fmtD(w['From Date'])}</div><div style="color:var(--mut)">${fmtD(w['To Date'])}</div>
        <div class="num">${fmt1(w['Daily Hours'])}</div><div style="color:var(--mut)">${h(w.Location||'—')}</div>
        <div style="color:var(--mut)">${h(w['Planned By']||'Self')}</div>
        <div style="color:#486581" title="${h(w.Description)}">${h(w.Description||'')}</div>
        <div style="white-space:nowrap">${acts}</div></div>`;
    }).join('') || '<div style="padding:24px" class="sub">No team plans match.</div>';
    const mgrPlanned = rows.filter(w=>w['Planned By']).length;
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="card"><div style="font:800 22px Inter;color:var(--navy)">${rows.length}</div><div class="sub">Team plan entries (filtered)</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--ok)">${Object.keys(byEmp).length}</div><div class="sub">People with plans</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--goldd)">${mgrPlanned}</div><div class="sub">Manager-planned entries</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--mut)">${rows.length-mgrPlanned}</div><div class="sub">Self-planned entries</div></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span class="h">Team plan — next 30 days</span>${tabBtns}
        <select style="width:160px;margin-left:12px" onchange="APP.fGo('tpt','femp',this.value)"><option value="">Employee: All</option>${emps.map(x=>`<option ${x===F.femp?'selected':''}>${h(x)}</option>`).join('')}</select>
        <select style="width:170px" onchange="APP.fGo('tpt','fclient',this.value)"><option value="">Client: All</option>${clis.map(x=>`<option ${x===F.fclient?'selected':''}>${h(x)}</option>`).join('')}</select>
        <select style="width:130px" onchange="APP.fGo('tpt','floc',this.value)"><option value="">Location: All</option>${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${l===F.floc?'selected':''}>${l}</option>`).join('')}</select>
        <select style="width:150px" onchange="APP.fGo('tpt','fby',this.value)"><option value="">Planned by: All</option>${bys.map(x=>`<option ${x===F.fby?'selected':''}>${h(x)}</option>`).join('')}</select>
        <input id="q_tpt" style="width:150px" placeholder="🔍 Search…" value="${h(F.q||'')}" oninput="APP.qGo('tpt', this.value)">
        <button class="btn" style="margin-left:auto" onclick="APP.tpForm()">+ Team plan</button>
      </div>
      <div style="overflow-x:auto;border:1px solid var(--line2);border-radius:8px">${gridHead}${gridRows||'<div style="padding:20px" class="sub">No plans in the next 30 days.</div>'}</div>
      <div class="sub" style="margin-top:8px">Cell = planned hours · green ≥6h · amber &lt;6h · grey off-day · 🏖 leave · hover for detail</div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line)"><span class="h">Team plan entries</span></div>
      <div class="xt">${thdr('tpt', cols, gtc)}<div id="tb_tpt">${TBODY.tpt()}</div></div>
    </div>`;
  }

  function wpTabGo(t) { S.wpTab = t; rWorkplan(); }
  function wpNew(iso) {
    const pre = iso ? { 'From Date': iso, 'To Date': iso } : null;
    wpForm(pre, null);
  }

  function tpForm() {
    const d = S.cache.wp || {};
    const raw = S.cache.tpRaw || {};
    const PR = d.pairs || [];
    const tpClients = [...new Set(PR.map(p=>p.c))].sort();
    const emps = (raw.employees||[]);
    modal('Team plan — multiple staff', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="grid-column:1/-1"><label class="sub">Staff (tick everyone this plan applies to)</label>
          <div style="max-height:150px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
            ${emps.map(e=>`<label style="display:flex;gap:6px;align-items:center;font:500 12px Inter"><input type="checkbox" class="tp_emp" value="${h(e.email)}" style="width:auto"> ${h(e.name)}</label>`).join('')}
          </div></div>
        <div style="grid-column:1/-1"><label class="sub">Client (active assignments only)</label><select id="tp2_client"><option value="">Client…</option>${tpClients.map(c=>`<option>${h(c)}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Service</label><select id="tp2_task"><option value="">Service…</option></select></div>
        <div><label class="sub">From</label><input type="date" id="tp2_from"></div>
        <div><label class="sub">To</label><input type="date" id="tp2_to"></div>
        <div><label class="sub">Hours/day (≤6)</label><input type="number" id="tp2_hrs" step="0.5" min="0.5" max="6" value="6"></div>
        <div><label class="sub">Location</label><select id="tp2_loc">${['Office','Client Place','WFH','Travelling'].map(l=>`<option>${l}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Description (2–100 chars)</label><input id="tp2_desc" maxlength="100"></div>
        <label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font:500 12px Inter"><input type="checkbox" id="tp2_off" style="width:auto"> Include Sundays &amp; holidays on purpose</label>
      </div>
      <div style="margin-top:14px"><button class="btn" id="tp2_save">Plan for selected staff</button></div>`);
    const fillT = () => { const c=$('tp2_client').value; const ts=[...new Set(PR.filter(p=>p.c===c).map(p=>p.k))].sort(); $('tp2_task').innerHTML = '<option value="">Service…</option>' + ts.map(t=>`<option>${h(t)}</option>`).join(''); };
    $('tp2_client').onchange = fillT;
    $('tp2_save').onclick = async () => {
      const emails = [...document.querySelectorAll('.tp_emp:checked')].map(x=>x.value);
      if (!emails.length) return toast('Tick at least one staff member', true);
      const entry = { client: $('tp2_client').value, task: $('tp2_task').value,
        fromDate: $('tp2_from').value, toDate: $('tp2_to').value, dailyHours: $('tp2_hrs').value,
        location: $('tp2_loc').value, description: $('tp2_desc').value.trim(),
        includeOffDays: $('tp2_off').checked ? 'Yes' : 'No' };
      if (!entry.client || !entry.task) return toast('Pick client and service', true);
      $('tp2_save').disabled = true;
      try {
        const r = await EMS2.callAPI('addTeamPlan', { entry, employees: emails });
        closeModal(); S.cache.tpRaw = null; toast('Planned for ' + r.created + ' staff ✓'); rWorkplan();
      } catch (e) { toast(e.message, true); $('tp2_save').disabled = false; }
    };
  }

  function wpForm(w, mode) {
    const d = S.cache.wp; const isEdit = !!(w && w['Row ID']);
    const PR = (d && d.pairs) || [];
    const wpClients = [...new Set(PR.map(p=>p.c))].sort();
    const inner = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="grid-column:1/-1"><label class="sub">Client (active assignments only)</label><select id="wp_client"><option value="">Client…</option>${wpClients.map(c=>`<option ${w&&w.Client===c?'selected':''}>${h(c)}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Service</label><select id="wp_task"><option value="">Service…</option></select></div>
        <div><label class="sub">From</label><input type="date" id="wp_from" value="${w?w['From Date']||'':''}"></div>
        <div><label class="sub">To</label><input type="date" id="wp_to" value="${w?w['To Date']||'':''}"></div>
        <div><label class="sub">Hours/day (≤6)</label><input type="number" id="wp_hrs" step="0.5" min="0.5" max="6" value="${w&&w['Daily Hours']?w['Daily Hours']:'6'}"></div>
        <div><label class="sub">Location</label><select id="wp_loc">${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${w&&w.Location===l?'selected':''}>${l}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Description (2–100 chars)</label><input id="wp_desc" maxlength="100" value="${w?h(w.Description||''):''}"></div>
        <label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font:500 12px Inter"><input type="checkbox" id="wp_off" style="width:auto" ${w&&w['Include Off Days']==='Yes'?'checked':''}> Include Sundays &amp; holidays on purpose</label>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px"><button class="btn" id="wp_save">${mode==='revise'?'Revise from today':isEdit?'Update':'Add plan'}</button></div>`;
    modal(mode==='revise'?'Revise plan (past days stay frozen)':isEdit?'Edit plan':'Plan work', inner);
    const fillT = () => { const c=$('wp_client').value; const ts=[...new Set(PR.filter(p=>p.c===c).map(p=>p.k))].sort(); $('wp_task').innerHTML = '<option value="">Service…</option>' + ts.map(t=>`<option ${w&&w.Task===t?'selected':''}>${h(t)}</option>`).join(''); };
    $('wp_client').onchange = fillT; fillT();
    $('wp_save').onclick = async () => {
      const entry = { employeeEmail: S.me['Employee Email'], client: $('wp_client').value, task: $('wp_task').value,
        fromDate: $('wp_from').value, toDate: $('wp_to').value, dailyHours: $('wp_hrs').value,
        location: $('wp_loc').value, description: $('wp_desc').value.trim(), includeOffDays: $('wp_off').checked ? 'Yes' : 'No' };
      if (!entry.client || !entry.task) return toast('Pick client and service', true);
      if (isEdit) entry.rowId = w['Row ID'];
      const action = mode==='revise' ? 'reviseWorkPlanEntry' : isEdit ? 'updateWorkPlanEntry' : 'addWorkPlanEntry';
      $('wp_save').disabled = true;
      try { await EMS2.callAPI(action, { entry }); closeModal(); S.cache.tpRaw = null; toast('Plan saved ✓'); rWorkplan(); }
      catch (e) { toast(e.message, true); $('wp_save').disabled = false; }
    };
  }

  async function wpEnd(rowId) {
    if (!confirm('End this plan as of yesterday?')) return;
    try { await EMS2.callAPI('endWorkPlanEntry', { rowId, email: S.me['Employee Email'] }); S.cache.tpRaw = null; toast('Ended ✓'); rWorkplan(); }
    catch (e) { toast(e.message, true); }
  }
  async function wpDel(rowId) {
    if (!confirm('Delete this future plan?')) return;
    try { await EMS2.callAPI('deleteWorkPlanEntry', { rowId, email: S.me['Employee Email'] }); S.cache.tpRaw = null; toast('Deleted ✓'); rWorkplan(); }
    catch (e) { toast(e.message, true); }
  }

      <div class="xt">${thdr('lvt', lvCols, gtcL)}<div id="tb_lvt">${TBODY.lvt()}</div></div>

        <select style="width:130px;margin-left:12px" onchange="APP.fGo('cot','fstatus',this.value)"><option value="">Status: All</option>${['Pending','Approved','Rejected','Cancelled'].map(s=>`<option ${s===Fco.fstatus?'selected':''}>${s}</option>`).join('')}</select>
        <input id="q_cot" style="width:170px" placeholder="🔍 Search…" value="${h(Fco.q||'')}" oninput="APP.qGo('cot', this.value)">

  // ---------------- EXPENSES ----------------
  async function rExpenses() {
    const d = S.cache.exp || (S.cache.exp = await EMS2.callAPI('initExpense', {}));
    if (!S.exMonth) S.exMonth = S.myday.today.date.slice(0,7);
    const all = d.expenses || [];
    const months = [...new Set(all.map(x=>String(x.Date||'').slice(0,7)))].filter(Boolean);
    if (!months.includes(S.exMonth)) months.push(S.exMonth);
    months.sort().reverse();
    const mine = all.filter(x=>String(x.Date||'').startsWith(S.exMonth));
    const sum = st => mine.filter(x=>!st||x.Status===st).reduce((s,x)=>s+(+x.Amount||0),0);
    const F = TSORT['exp'] = TSORT['exp']||{};
    const gtc = '84px 112px 80px 84px 1.3fr 150px 94px 90px 118px';
    const cols = [{k:'Date',l:'Date'},{k:'Expense Type',l:'Type'},{k:'Amount',l:'Claimed ₹',r:1},{k:'Approved Amount',l:'Appr. ₹',r:1},{k:'Description',l:'Description'},{k:'Client Name',l:'Client'},{k:'Reimbursement By',l:'Reimb.'},{k:'Status',l:'Status'},{l:''}];
    const types = [...new Set(all.map(x=>x['Expense Type']).filter(Boolean))].sort();
    TBODY.exp = () => {
      let rows = mine;
      if (F.ftype) rows = rows.filter(x=>x['Expense Type']===F.ftype);
      if (F.fstatus) rows = rows.filter(x=>x.Status===F.fstatus);
      rows = applySort('exp', tq('exp', rows), 'Date', 'desc');
      return rows.map(x=>{
        const p = x.Status==='Pending';
        return `<div class="xr" style="grid-template-columns:${gtc};cursor:pointer" onclick="APP.exView('${x['Row ID']}')">
          <div style="color:var(--mut)">${fmtD(x.Date)}</div><div>${h(x['Expense Type'])}</div><div class="num">${fmt1(x.Amount)}</div>
          <div class="num" style="color:${x['Approved Amount']!=null&&+x['Approved Amount']<+x.Amount?'var(--goldd)':'var(--ok)'}">${x['Approved Amount']!=null?fmt1(x['Approved Amount']):'—'}</div>
          <div style="color:#486581" title="${h(x.Description)}">${h(x.Description||'')}</div><div style="color:var(--mut)">${h(x['Client Name']||'—')}</div>
          <div style="color:var(--mut)">${h(x['Reimbursement By']||'')}</div>
          <div><span class="pill" style="background:${x.Status==='Approved'?'var(--okbg)':p?'var(--goldbg)':'var(--line2)'};color:${x.Status==='Approved'?'var(--ok)':p?'var(--goldd)':'var(--mut)'}">${h(x.Status)}</span></div>
          <div style="white-space:nowrap" onclick="event.stopPropagation()">${p?`<button class="btn2" style="padding:2px 8px;font-size:11px" onclick='APP.exForm(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button> <button class="btn2" style="padding:2px 8px;font-size:11px;color:var(--bad)" onclick="APP.exCancel('${x['Row ID']}')">Cancel</button>`:''}${x['Receipt File']?` <button class="btn2" style="padding:2px 8px;font-size:11px" title="View bill" onclick="APP.viewBill('${x['Receipt File']}')">📎</button>`:''}</div>
        </div>`;}).join('')
        + `<div style="display:flex;gap:16px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);font:600 11.5px Inter;color:#486581"><span>Σ ${rows.length} rows · <b style="color:var(--navy)">₹${fmt1(rows.reduce((s,x)=>s+(+x.Amount||0),0))}</b></span></div>`;
    };
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:170px repeat(4,1fr)">
      <div class="card"><div class="sub" style="margin-bottom:6px">Month</div><select onchange="APP.exMonthGo(this.value)">${months.map(mm=>`<option value="${mm}" ${mm===S.exMonth?'selected':''}>${fmtM(mm)}</option>`).join('')}</select></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--navy)">₹${fmt1(sum())}</div><div class="sub">Claimed</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--ok)">₹${fmt1(sum('Approved'))}</div><div class="sub">Approved</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--bad)">₹${fmt1(sum('Rejected'))}</div><div class="sub">Rejected</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--goldd)">₹${fmt1(sum('Pending'))}</div><div class="sub">Pending</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="h">My expenses</span><span class="sub">${fmtM(S.exMonth)}</span>
        <select style="width:150px;margin-left:12px" onchange="APP.fGo('exp','ftype',this.value)"><option value="">Type: All</option>${types.map(t=>`<option ${t===F.ftype?'selected':''}>${h(t)}</option>`).join('')}</select>
        <select style="width:130px" onchange="APP.fGo('exp','fstatus',this.value)"><option value="">Status: All</option>${['Pending','Approved','Rejected','Cancelled'].map(s=>`<option ${s===F.fstatus?'selected':''}>${s}</option>`).join('')}</select>
        <input id="q_exp" style="width:170px" placeholder="🔍 Search…" value="${h(F.q||'')}" oninput="APP.qGo('exp', this.value)">
        <button class="btn" style="margin-left:auto" onclick="APP.exForm()">+ Submit expense</button>
      </div>
      <div class="xt">${thdr('exp', cols, gtc)}<div id="tb_exp">${TBODY.exp()}</div></div>
    </div>`;
  }

  function exForm(x) {
    const d = S.cache.exp || {}; const isEdit = !!x;
    const types = (d.expenseTypes||[]);
    const clients = (d.clients||[]).map(c=>c['Client Full Name']).filter(Boolean);
    modal(isEdit?'Edit expense':'Submit expense', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">Date (within 7 days)</label><input type="date" id="ex_date" value="${x?x.Date:''}"></div>
        <div><label class="sub">Type</label><select id="ex_type" onchange="APP.exHint()"><option value="">Type…</option>${types.map(t=>`<option ${x&&x['Expense Type']===t['Expense Type']?'selected':''}>${h(t['Expense Type'])}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1" id="ex_hint" class="sub"></div>
        <div><label class="sub">Amount ₹</label><input type="number" id="ex_amt" min="1" step="0.01" value="${x?x.Amount:''}"></div>
        <div><label class="sub">Reimbursement by</label><select id="ex_by" onchange="document.getElementById('ex_cli_row').style.display=this.value==='Client'?'':'none'"><option value="">Select…</option>${['Client','DRP & Co. LLP'].map(v=>`<option ${x&&x['Reimbursement By']===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div id="ex_cli_row" style="grid-column:1/-1;display:${x&&x['Reimbursement By']==='Client'?'':'none'}"><label class="sub">Client</label><select id="ex_client"><option value="">Client…</option>${clients.map(c=>`<option ${x&&x['Client Name']===c?'selected':''}>${h(c)}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Receipt reference</label><input id="ex_ref" value="${x?h(x['Receipt Reference']||''):''}"></div>
        <div style="grid-column:1/-1"><label class="sub">Bill copy (optional · photo or PDF · max 5 MB)</label><input type="file" id="ex_file" accept="image/jpeg,image/png,image/webp,application/pdf">
          ${isEdit&&x['Receipt File']?`<div class="sub" style="margin-top:4px">📎 Bill attached — <a href="#" onclick="APP.viewBill('${h(x['Receipt File'])}');return false">view</a> · choosing a new file replaces it</div>`:''}</div>
        <div style="grid-column:1/-1"><label class="sub">Description — ${SANE_HINT}</label><textarea id="ex_desc" rows="2">${x?h(x.Description||''):''}</textarea></div>
      </div>
      <div style="margin-top:14px"><button class="btn" id="ex_save">${isEdit?'Update':'Submit'}</button></div>`);
    exHint();
    $('ex_save').onclick = async () => {
      const desc = $('ex_desc').value.trim();
      const tsel = types.find(t=>t['Expense Type']===$('ex_type').value);
      const maxAllowed = tsel && tsel['Max Allowed'] != null && tsel['Max Allowed'] !== '' ? +tsel['Max Allowed'] : null;
      if (!$('ex_date').value) return toast('Pick the date', true);
      if (!$('ex_type').value) return toast('Pick the type', true);
      if (!(+$('ex_amt').value > 0)) return toast('Enter a valid amount', true);
      if (maxAllowed && +$('ex_amt').value > maxAllowed) return toast($('ex_type').value + ' claims are capped at ₹' + fmt1(maxAllowed) + ' per claim', true);
      if (!$('ex_by').value) return toast('Select who reimburses', true);
      if ($('ex_by').value==='Client' && !$('ex_client').value) return toast('Select the client', true);
      if ($('ex_ref').value.trim().length < 3) return toast('Receipt reference required', true);
      if (!sane(desc)) return toast('Description must be a ' + SANE_HINT, true);
      const f = ($('ex_file').files && $('ex_file').files[0]) || null;
      if (f && f.size > 5*1024*1024) return toast('Bill file is over 5 MB — compress or rescan it', true);
      if (f && !/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)) return toast('Only photos (JPG/PNG/WebP) or PDF bills', true);
      $('ex_save').disabled = true;
      try {
        let receiptFile = '';
        if (f) {
          toast('Uploading bill…');
          const c = await EMS2.ready;
          const u = await c.auth.getUser();
          const uid = u.data && u.data.user ? u.data.user.id : null;
          if (!uid) throw new Error('Session expired — sign in again.');
          const safe = f.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(-60);
          const up = await c.storage.from('expense-receipts').upload(uid + '/' + Date.now() + '_' + safe, f, { contentType: f.type });
          if (up.error) throw new Error('Upload failed: ' + up.error.message);
          receiptFile = up.data.path;
        }
        const expense = { employeeEmail: S.me['Employee Email'], employeeName: S.me['Employee Name'],
          date: $('ex_date').value, expenseType: $('ex_type').value, amount: parseFloat($('ex_amt').value),
          description: desc, reimbursementBy: $('ex_by').value, clientName: $('ex_client').value,
          receiptReference: $('ex_ref').value.trim(), receiptFile };
        if (isEdit) expense.rowId = x['Row ID'];
        await EMS2.callAPI(isEdit?'updateExpense':'submitExpense', { expense });
        closeModal(); S.cache.exp = null; toast(isEdit?'Updated ✓':'Submitted ✓'); rExpenses();
      } catch (e) { toast(e.message, true); $('ex_save').disabled = false; }
    };
  }

  async function vizGo(kind, opts) {
    opts = opts || {};
    const mount = $('viz_' + kind); if (!mount) return;
    const btn = $('viz_btn_' + kind); if (btn) btn.style.display = 'none';
    mount.innerHTML = '<div class="skel" style="height:140px;margin-top:12px"></div>';
    try {
      if (kind === 'u') {
        const d = await EMS2.callAPI('viz_user', { employee: opts.employee || '', client: opts.client || '' });
        S.cache.vizU = d;
        mount.innerHTML = vizUserHtml(d, opts);
        const sc = $('stk_scroll'); if (sc) sc.scrollLeft = sc.scrollWidth;
      } else {
        const d = await EMS2.callAPI('viz_client', { client: opts.client || '' });
        S.cache.vizC = d;
        mount.innerHTML = vizClientHtml(d, opts);
        const sc2 = $('stk_scroll'); if (sc2) sc2.scrollLeft = sc2.scrollWidth;
      }
    } catch (e) { mount.innerHTML = '<div class="sub" style="padding:12px">' + h(e.message) + '</div>'; }
  }

  function vMonthBars(monthly, opts) {
    opts = opts || {};
    if (!monthly.length) return '<div class="sub" style="padding:10px">No data.</div>';
    const key = opts.key || 'hours';
    const maxV = Math.max(1, ...monthly.map(m=>+m[key]||0));
    const avg = monthly.reduce((s,m)=>s+(+m[key]||0),0) / monthly.length;
    const bars = monthly.map((m,i)=>{
      const v = +m[key]||0;
      const bh = Math.round(78 * v / maxV);
      const lbl = i % 3 === 0 ? fmtM(m.ym) : '';
      const split = opts.split ? Math.round(bh * Math.min(1, (+m[opts.split]||0) / (v||1))) : 0;
      const barInner = opts.split
        ? `<div style="width:14px;height:${bh}px;display:flex;flex-direction:column;justify-content:flex-end"><div style="height:${bh-split}px;background:#b3261e;border-radius:3px 3px 0 0"></div><div style="height:${split}px;background:var(--ok);border-radius:${bh-split>0?'0':'3px 3px 0 0'}"></div></div>`
        : `<div style="width:14px;height:${bh}px;background:${opts.color||'var(--navy)'};border-radius:3px 3px 0 0"></div>`;
      return `<div title="${fmtM(m.ym)}: ${fmt1(v)}${opts.unit||'h'}${opts.split?' · billable '+fmt1(m[opts.split])+'h':''}" style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:none">
        <div style="height:80px;display:flex;align-items:flex-end">${barInner}</div>
        <div style="font:500 8.5px Inter;color:var(--fog);white-space:nowrap;transform:rotate(-40deg);transform-origin:top left;height:24px;width:14px">${lbl}</div></div>`;
    }).join('');
    const avgPct = Math.round(78 * avg / maxV);
    return `<div style="position:relative;overflow-x:auto;padding-bottom:2px"><div style="position:absolute;left:0;right:0;bottom:${26+avgPct}px;border-top:2px dashed var(--gold);z-index:1" title="average ${fmt1(avg)}"></div><div style="display:flex;gap:4px;align-items:flex-end;min-width:min-content;position:relative">${bars}</div></div><div class="sub" style="margin-top:2px">– – gold line = monthly average (${fmt1(avg)}${opts.unit||'h'})</div>`;
  }

  function vPctBars(monthly, num, den, ref) {
    if (!monthly.length) return '<div class="sub" style="padding:10px">No data.</div>';
    const bars = monthly.map((m,i)=>{
      const pct = (+m[den]||0) > 0 ? 100 * (+m[num]||0) / (+m[den]) : 0;
      const bh = Math.round(60 * Math.min(100, pct) / 100);
      const col = pct >= ref ? 'var(--ok)' : pct >= ref*0.6 ? '#d69e06' : '#b3261e';
      const lbl = i % 3 === 0 ? fmtM(m.ym) : '';
      return `<div title="${fmtM(m.ym)}: ${fmt1(pct)}%" style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:none">
        <div style="height:62px;display:flex;align-items:flex-end"><div style="width:14px;height:${bh}px;background:${col};border-radius:3px 3px 0 0"></div></div>
        <div style="font:500 8.5px Inter;color:var(--fog);white-space:nowrap;transform:rotate(-40deg);transform-origin:top left;height:24px;width:14px">${lbl}</div></div>`;
    }).join('');
    const refY = 26 + Math.round(60 * ref / 100);
    return `<div style="position:relative;overflow-x:auto"><div style="position:absolute;left:0;right:0;bottom:${refY}px;border-top:2px dashed var(--gold);z-index:1"></div><div style="display:flex;gap:4px;align-items:flex-end;min-width:min-content">${bars}</div></div><div class="sub" style="margin-top:2px">– – reference ${ref}%</div>`;
  }

  function vTreemap(items, clickJs, hue) {
    if (!items.length) return '<div class="sub" style="padding:10px">No data.</div>';
    let arr = items.slice().sort((a,b)=>(+b.hours||0)-(+a.hours||0));
    if (arr.length > 12) {
      const rest = arr.slice(11);
      arr = arr.slice(0,11);
      arr.push({ name: 'Others (' + rest.length + ')', hours: Math.round(rest.reduce((s,x)=>s+(+x.hours||0),0)*10)/10, _others: true });
    }
    const RAMPS = {
      blue:   ['#0c2d6b','#1e40af','#1d4ed8','#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe'],
      green:  ['#14532d','#166534','#15803d','#16a34a','#22c55e','#4ade80','#86efac','#bbf7d0'],
      orange: ['#7c2d12','#9a3412','#c2410c','#ea580c','#f97316','#fb923c','#fdba74','#fed7aa']
    };
    const RAMP = RAMPS[hue] || RAMPS.blue;
    const darkTxt = hue==='green' ? '#14532d' : hue==='orange' ? '#7c2d12' : '#0c2d6b';
    const tot = arr.reduce((s,x)=>s+(+x.hours||0),0) || 1;
    const n = arr.length;
    const target = tot / Math.max(2, Math.round(Math.sqrt(n)));
    const rows = []; let cur = [], curSum = 0;
    arr.forEach(x => {
      cur.push(x); curSum += (+x.hours||0);
      if (curSum >= target * 0.9 && rows.length < 3) { rows.push({ items: cur, sum: curSum }); cur = []; curSum = 0; }
    });
    if (cur.length) rows.push({ items: cur, sum: curSum });
    let rank = 0;
    return `<div style="height:100%;display:flex;flex-direction:column;gap:3px">${rows.map(r=>`
      <div style="flex:${Math.max(1, Math.round(1000*r.sum/tot))} 1 0;display:flex;gap:3px;min-height:0">${r.items.map(x=>{
        const idx = Math.round((n<2?0:(rank)/(n-1)) * (RAMP.length-1)); rank++;
        const share = (+x.hours||0) / tot;
        const js = (clickJs && !x._others) ? clickJs.split('__NAME__').join(String(x.name).split("'").join("\\'")) : '';
        return `<div ${js?`onclick=\"${js}\"`:''} title="${h(x.name)}: ${fmt1(x.hours)}h (${fmt1(100*share)}%)" style="flex:${Math.max(1, Math.round(1000*(+x.hours||0)/r.sum))} 1 0;background:${RAMP[idx]};color:${idx>=6?darkTxt:'#fff'};border-radius:6px;padding:6px 8px;min-width:0;overflow:hidden;${js?'cursor:pointer;':''}">
          <div style="font:600 10.5px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${h(x.name)}</div>
          <div style="font:500 9.5px Inter;opacity:.85">${fmt1(x.hours)}h · ${fmt1(100*share)}%</div></div>`;
      }).join('')}</div>`).join('')}</div>`;
  }

  function vTaskBars(tasks) {
    if (!tasks.length) return '<div class="sub" style="padding:10px">No data.</div>';
    const maxV = Math.max(1, ...tasks.map(t=>+t.hours||0));
    return tasks.map(t=>{
      const w = Math.round(100 * (+t.hours||0) / maxV);
      const bw = Math.round(w * Math.min(1, (+t.billable||0) / ((+t.hours)||1)));
      return `<div style="margin-bottom:6px" title="${h(t.name)}: ${fmt1(t.hours)}h · billable ${fmt1(t.billable||0)}h">
        <div style="display:flex;justify-content:space-between;font:500 11px Inter;color:var(--ink)"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%">${h(t.name)}</span><span class="sub">${fmt1(t.hours)}h</span></div>
        <div style="height:8px;background:var(--line2);border-radius:99px;margin-top:2px;overflow:hidden;display:flex"><div style="width:${bw}%;background:var(--ok)"></div><div style="width:${w-bw}%;background:#b3261e"></div></div></div>`;
    }).join('') + '<div class="sub">green = billable · red = non-billable</div>';
  }

  function vStack6(monthly, opts) {
    opts = opts || {};
    const costMode = opts.line === 'cost';
    if (!monthly.length) return '<div class="sub" style="padding:10px">No data.</div>';
    const H = 168, colW = 64;
    const maxT = Math.max(1, ...monthly.map(m=>+m.hours||0));
    const fmtC = v => { v=+v||0; return v>=100000 ? '₹'+(v/100000).toFixed(1)+'L' : v>=1000 ? '₹'+Math.round(v/1000)+'k' : '₹'+Math.round(v); };
    const maxL = costMode ? Math.max(1, ...monthly.map(m=>+m.cost||0)) : 100;
    const lv = m => costMode ? (+m.cost||0) : ((+m.hours||0)>0 ? 100*(+m.billable||0)/(+m.hours) : 0);
    const w = monthly.length * colW;
    const pts = monthly.map((m,i)=>({ x: i*colW+colW/2, y: Math.max(12, H - H*lv(m)/maxL), v: lv(m) }));
    const poly = pts.map(p=>p.x+','+p.y).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--gold)"/>`).join('');
    const labels = costMode ? pts.map(p=>`<text x="${p.x}" y="${p.y-7}" text-anchor="middle" style="font:600 8.5px Inter" fill="#8f6b1e">${fmtC(p.v)}</text>`).join('') : '';
    const cols = monthly.map((m,i)=>{
      const bh = Math.round(H*(+m.billable||0)/maxT);
      const nb = Math.max(0, Math.round(H*(+m.hours||0)/maxT) - bh);
      return `<div style="width:${colW}px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px">
        <div title="${fmtM(m.ym)}: total ${fmt1(m.hours)}h · billable ${fmt1(m.billable)}h${costMode?' · cost '+fmtC(m.cost):' ('+fmt1(pts[i].v)+'%)'}" style="height:${H}px;display:flex;flex-direction:column;justify-content:flex-end">
          <div style="width:30px"><div style="height:${nb}px;background:#9fb3c8;border-radius:4px 4px 0 0"></div><div style="height:${bh}px;background:var(--ok);${nb>0?'':'border-radius:4px 4px 0 0'}"></div></div>
        </div>
        <div style="font:600 9.5px Inter;color:var(--mut);white-space:nowrap">${fmtM(m.ym)}</div></div>`;
    }).join('');
    return `<div style="display:flex;gap:6px;height:100%">
      <div style="display:flex;flex-direction:column;justify-content:space-between;font:500 9px Inter;color:var(--fog);padding-bottom:18px;flex:none"><span>${fmt1(maxT)}h</span><span>0</span></div>
      <div id="stk_scroll" style="flex:1;overflow-x:auto;min-width:0"><div style="position:relative;width:${w}px">
        <svg width="${w}" height="${H}" style="position:absolute;left:0;top:0;pointer-events:none;z-index:2"><polyline points="${poly}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="4 3"/>${dots}${labels}</svg>
        <div style="display:flex">${cols}</div>
      </div></div>
      <div style="display:flex;flex-direction:column;justify-content:space-between;font:500 9px Inter;color:var(--goldd);padding-bottom:18px;flex:none"><span>${costMode?fmtC(maxL):'100%'}</span><span>${costMode?'₹0':'0%'}</span></div>
    </div>
    <div class="sub" style="margin-top:4px">■ billable (green) · ■ non-billable (grey) · –– gold line = ${costMode?'task cost (₹)':'% billable'} · scroll for older months</div>`;
  }

  function vizUserHtml(d, opts) {
    const mon = d.monthly || [];
    const tot = mon.reduce((s,m)=>s+(+m.hours||0),0);
    const bill = mon.reduce((s,m)=>s+(+m.billable||0),0);
    const idle = mon.reduce((s,m)=>s+(+m.idle||0),0);
    const pctB = tot>0 ? 100*bill/tot : 0;
    const pctI = tot>0 ? 100*idle/tot : 0;
    const top3 = a => (a||[]).slice(0,3).map(x=>`<div style="font:600 11px Inter;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${h(x.name)}">${h(x.name)} <span style="font:500 10px Inter;color:var(--fog)">${fmt1(x.hours)}h</span></div>`).join('') || '<span class="sub">—</span>';
    const empSel = (d.employees||[]).length ? `<input list="dl_emp" placeholder="🔍 Employee… (blank = me)" value="${h(((d.employees||[]).find(e=>e.email===opts.employee)||{}).name||'')}" style="width:210px" onchange="APP.vizEmpGo(this.value)"><datalist id="dl_emp">${d.employees.map(e=>`<option value="${h(e.name)}"></option>`).join('')}</datalist>` : `<span class="sub">${h(d.employeeName)}</span>`;
    const clientChip = opts.client ? `<span class="pill" style="background:var(--goldbg);color:var(--goldd);cursor:pointer" onclick="APP.vizGo('u',{employee:'${h(opts.employee||'')}'})">Client: ${h(opts.client)} ✕</span>` : '<span class="sub">click a client tile to focus</span>';
    const tile = (v, lbl, col) => `<div style="border:1px solid var(--line2);border-radius:10px;padding:12px 14px"><div style="font:800 20px Inter;color:${col||'var(--navy)'}">${v}</div><div class="sub">${lbl}</div></div>`;
    const card = (t, b) => `<div style="border:1px solid var(--line2);border-radius:10px;padding:12px;height:296px;display:flex;flex-direction:column;min-width:0"><div class="sub" style="font-weight:700;color:var(--navy);margin-bottom:8px">${t}</div><div style="flex:1;min-height:0;overflow:auto">${b}</div></div>`;
    return `
    <div style="display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap">${empSel}${clientChip}<span class="sub" style="margin-left:auto">data: ${fmtD((d.range||{}).from)} → ${fmtD((d.range||{}).to)}</span></div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px">
      ${tile(fmt1(tot), 'Total hours')}
      ${tile(fmt1(pctB)+'%', '% billable', 'var(--ok)')}
      ${tile(fmt1(pctI)+'%', '% idle time', 'var(--goldd)')}
      <div style="border:1px solid var(--line2);border-radius:10px;padding:10px 14px"><div class="sub" style="margin-bottom:4px">3 key clients</div>${top3(d.clients)}</div>
      <div style="border:1px solid var(--line2);border-radius:10px;padding:10px 14px"><div class="sub" style="margin-bottom:4px">3 key tasks</div>${top3(d.tasks)}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${card('Clients worked for', vTreemap(d.clients||[], `APP.vizGo('u',{employee:'${h(opts.employee||'')}',client:'__NAME__'})`, 'blue'))}
      ${card('Work performed', vTreemap(d.tasks||[], null, 'green'))}
      ${card('Months — billable hours &amp; % billable', vStack6(mon))}
      ${card('Location', vTreemap(d.locations||[], null, 'orange'))}
    </div>`;
  }

  function vizClientHtml(d, opts) {
    const k = d.kpis || {};
    const fmt0 = n => Math.round(+n||0).toLocaleString('en-IN');
    const sel = `<input list="dl_cli" placeholder="🔍 Client… (blank = all clients)" value="${h(opts.client||'')}" style="width:260px" onchange="APP.vizCliGo(this.value)"><datalist id="dl_cli">${(d.clients||[]).map(c=>`<option value="${h(c)}"></option>`).join('')}</datalist>`;
    const topEmp = (d.employees||[]).slice(0,3).map(x=>`<div style="font:600 11px Inter;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${h(x.name)}">${h(x.name)} <span style="font:500 10px Inter;color:var(--fog)">${fmt1(x.hours)}h</span></div>`).join('') || '<span class="sub">—</span>';
    const topSvc = (d.taskCost||[]).slice(0,3).map(x=>`<div style="font:600 11px Inter;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${h(x.task)}">${h(x.task)} <span style="font:500 10px Inter;color:var(--fog)">₹${fmt0((+x.bcost||0)+(+x.ncost||0))}</span></div>`).join('') || '<span class="sub">—</span>';
    const tile = (v, lbl, col) => `<div style="border:1px solid var(--line2);border-radius:10px;padding:12px 14px"><div style="font:800 19px Inter;color:${col||'var(--navy)'};white-space:nowrap">${v}</div><div class="sub">${lbl}</div></div>`;
    const card = (t, b) => `<div style="border:1px solid var(--line2);border-radius:10px;padding:12px;height:296px;display:flex;flex-direction:column;min-width:0"><div class="sub" style="font-weight:700;color:var(--navy);margin-bottom:8px">${t}</div><div style="flex:1;min-height:0;overflow:auto">${b}</div></div>`;
    const tc = d.taskCost || [];
    const tcRow = (a,b2,c2,dd,bold) => `<div style="display:grid;grid-template-columns:1.4fr 70px 110px 110px;gap:8px;font:${bold?'700':'500'} 11.5px Inter;color:var(--ink);border-bottom:1px solid var(--line2);padding:5px 0"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${h(a)}">${h(a)}</span><span style="text-align:right">${b2}</span><span style="text-align:right">${c2}</span><span style="text-align:right">${dd}</span></div>`;
    const tcTable = tcRow('Task Type','Hours','Billable ₹','Non-billable ₹',1)
      + tc.map(x=>tcRow(x.task, fmt0(x.hours), fmt0(x.bcost), fmt0(x.ncost))).join('')
      + tcRow('Σ Total', fmt0(tc.reduce((s,x)=>s+(+x.hours||0),0)), fmt0(tc.reduce((s,x)=>s+(+x.bcost||0),0)), fmt0(tc.reduce((s,x)=>s+(+x.ncost||0),0)), 1);
    return `
    <div style="display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap">${sel}<span class="sub">pick a client — every number below follows it</span><span class="sub" style="margin-left:auto">data: ${fmtD((d.range||{}).from)} → ${fmtD((d.range||{}).to)}</span></div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px">
      ${tile(fmt1(k.billableHours)+'h', 'Total billable hours', 'var(--ok)')}
      ${tile('₹'+fmt0(k.billableCost), 'Total billable cost')}
      ${tile('₹'+fmt0(k.expensesClaimed), 'Expenses claimed by staff', 'var(--goldd)')}
      <div style="border:1px solid var(--line2);border-radius:10px;padding:10px 14px"><div class="sub" style="margin-bottom:4px">Top 3 employees</div>${topEmp}</div>
      <div style="border:1px solid var(--line2);border-radius:10px;padding:10px 14px"><div class="sub" style="margin-bottom:4px">Top 3 services (by cost)</div>${topSvc}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      ${card('% work by task', vTreemap(d.tasks||[], null, 'blue'))}
      ${card('Hours by employee', vTreemap(d.employees||[], null, 'green'))}
      ${card('Months — billable hours &amp; task cost', vStack6(d.monthly||[], {line:'cost'}))}
      ${card('Task cost working', tcTable)}

    </div>`;
  }

  function vizEmpGo(name) {
    const d = S.cache.vizU || {};
    const e = (d.employees||[]).find(x=>x.name===name);
    if (name && !e) { toast('Pick an employee from the list', true); return; }
    vizGo('u', { employee: e ? e.email : '' });

    const d = S.cache.vizC || {};
    if (v && !(d.clients||[]).includes(v)) { toast('Pick a client from the list', true); return; }
