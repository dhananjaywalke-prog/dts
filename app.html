<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeWise EMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#102a43; --navy8:#243b53; --ink:#243b53; --mut:#627d98; --fog:#829ab1; --line:#e3e9ef; --line2:#eef2f6; --bg:#f7f9fb; --gold:#d4a853; --goldd:#8f6b1e; --goldbg:#fdf6e6; --goldline:#ecd9a8; --ok:#1f7a4d; --okbg:#e6f4ea; --bad:#b3261e; --badbg:#fdecec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; font-size:14px; color:var(--ink); background:var(--bg); }
  #shell { display:flex; min-height:100vh; }
  /* sidebar */
  #side { width:216px; background:var(--navy); color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; flex:none; }
  #side .brand { padding:18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08); }
  #side .brand img { height:36px; filter:brightness(0) invert(1); opacity:.95; display:block; }
  #side .brand .bar { height:24px; width:1px; background:rgba(255,255,255,.25); }
  #side .brand b { font-size:12px; font-weight:700; }
  #nav { padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
  .nitem { display:flex; align-items:center; gap:10px; padding:9px 12px; border:0; border-left:3px solid transparent; border-radius:0 8px 8px 0; background:none; color:rgba(255,255,255,.72); font:500 13px Inter; cursor:pointer; text-align:left; width:100%; }
  .nitem:hover { color:#fff; background:rgba(255,255,255,.05); }
  .nitem.on { background:rgba(212,168,83,.16); border-left-color:var(--gold); color:#fff; font-weight:600; }
  .nitem .bdg { margin-left:auto; background:var(--gold); color:var(--navy); font:700 10px Inter; padding:1px 7px; border-radius:999px; }
  .nitem .dot { margin-left:auto; width:8px; height:8px; border-radius:50%; background:#e66a5b; }
  #side .foot { margin-top:auto; padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; }
  #side .foot .av { width:32px; height:32px; border-radius:50%; background:var(--gold); color:var(--navy); display:flex; align-items:center; justify-content:center; font:700 12px Inter; flex:none; }
  #side .foot button { background:none; border:0; color:rgba(255,255,255,.45); cursor:pointer; font-size:15px; }
  /* topbar + main */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #top { height:56px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 24px; position:sticky; top:0; z-index:40; }
  #top h1 { font:700 15px Inter; color:var(--navy); margin:0; }
  #top .date { font:500 12px Inter; color:var(--mut); }
  #view { flex:1; padding:20px 24px; }
  /* primitives */
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .h { font:700 13px Inter; color:var(--navy); }
  .sub { font:500 11px Inter; color:var(--mut); }
  .btn { background:var(--navy); color:#fff; border:0; border-radius:8px; font:600 12px Inter; padding:8px 16px; cursor:pointer; }
  .btn:hover { background:var(--navy8); }
  .btn[disabled] { opacity:.55; cursor:default; }
  .btn2 { background:#fff; color:var(--navy); border:1px solid #d9e2ec; border-radius:8px; font:600 12px Inter; padding:7px 12px; cursor:pointer; }
  .btn2:hover { border-color:var(--gold); }
  .pill { font:600 10px Inter; padding:1px 8px; border-radius:999px; }
  input, select, textarea { font:500 12.5px Inter; color:var(--ink); border:1px solid #d9e2ec; border-radius:8px; padding:8px 10px; background:#fff; width:100%; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,168,83,.15); }
  .grid { display:grid; gap:12px; }
  .skel { background:linear-gradient(90deg,#eef2f6 25%,#f7f9fb 50%,#eef2f6 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:8px; }
  @keyframes sk { from{background-position:200% 0} to{background-position:-200% 0} }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--navy); color:#fff; font:500 12.5px Inter; padding:10px 16px; border-radius:10px; box-shadow:0 8px 30px rgba(16,42,67,.35); z-index:99; }
  .toast.err { background:var(--bad); }
  /* excel-style table */
  .xt { font:500 12.5px Inter; }
  .xt .xh { display:grid; background:#f0f4f8; border-bottom:1px solid #d9e2ec; font:600 11px Inter; color:#486581; text-transform:uppercase; letter-spacing:.04em; position:sticky; top:56px; z-index:30; }
  .xt .xh > div { padding:8px 10px; cursor:pointer; user-select:none; white-space:nowrap; }
  .xt .xh > div:hover { color:var(--navy); }
  .xt .xr { display:grid; border-bottom:1px solid var(--line2); height:32px; align-items:center; }
  .xt .xr:nth-child(even) { background:#fbfcfe; }
  .xt .xr:hover { background:var(--goldbg); }
  .xt .xr > div { padding:0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .num { text-align:right; font-weight:600; }
  @media (max-width: 900px) { #side{width:64px} #side .brand b,#side .brand .bar,#side .foot div,#nav .lbl{display:none} #view{padding:12px} }
</style>
</head>
<body>
<div id="shell">
  <div id="side">
    <div class="brand"><img src="https://drpca.com/assets/drpca-logo.png" alt="DRP" onerror="this.outerHTML='<b style=color:#d4a853>drp&amp;co.</b>'"><div class="bar"></div><b>TimeWise</b></div>
    <div id="nav"></div>
    <div class="foot"><div class="av" id="uAv">··</div><div style="flex:1;min-width:0"><div id="uName" style="font:600 12px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">…</div><div id="uRole" style="font:500 10px Inter;color:rgba(255,255,255,.45)"></div></div><button title="Sign out" onclick="APP.signout()">⎋</button></div>
  </div>
  <div id="main">
    <div id="top"><h1 id="vTitle">…</h1><div class="date" id="vDate"></div><div style="margin-left:auto;display:flex;gap:10px;align-items:center"><button class="btn" onclick="APP.quickLog()">+ Log time</button></div></div>
    <div id="view"><div class="skel" style="height:200px;margin-top:10px"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
'use strict';
const APP = (() => {
  const S = { me:null, isApprover:false, isAdmin:false, view:null, cache:{}, masters:null, myday:null };
  const $ = id => document.getElementById(id);
  const h = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt1 = n => (Math.round((+n||0)*100)/100).toLocaleString('en-IN');
  const IST_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtD(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'-'+MONS[+m[2]-1]+'-'+m[1].slice(2) : h(iso||''); }
  function fmtM(ym){ const m=String(ym||'').match(/^(\d{4})-(\d{2})/); return m ? MONS[+m[2]-1]+'-'+m[1].slice(2) : h(ym||''); }
  function sane(t){ t=String(t||'').trim(); if(t.length<10) return false; const w=t.split(/\s+/); return w.length>=5 && w.filter(x=>/[A-Za-z]{3,}/.test(x)).length>=3; }
  const SANE_HINT = 'meaningful sentence: 10+ characters, 5+ real words';
  const TSORT = {};
  const VIEW_OF = { exp:'expenses', apl:'approvals', apx:'approvals' };
  function tsort(view, col){ const s=TSORT[view]=TSORT[view]||{}; if(s.col===col) s.dir=s.dir==='asc'?'desc':'asc'; else { s.col=col; s.dir='asc'; } RENDER[VIEW_OF[view]||view](); }
  function fGo(view, key, val){ (TSORT[view]=TSORT[view]||{})[key]=val; RENDER[VIEW_OF[view]||view](); }
  let _qdeb; function qGo(view, val){ (TSORT[view]=TSORT[view]||{}).q=val.trim(); clearTimeout(_qdeb); _qdeb=setTimeout(()=>{ RENDER[VIEW_OF[view]||view](); const el=document.getElementById('q_'+view); if(el){ el.focus(); const n=el.value.length; try{ el.setSelectionRange(n,n); }catch(e){} } },150); }
  function tq(view, rows){ const q=(TSORT[view]&&TSORT[view].q||'').toLowerCase(); return q ? rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q)) : rows; }
  function applySort(view, rows, defCol, defDir){ const s=TSORT[view]||{}; const col=s.col||defCol, dir=s.col?s.dir:(defDir||'asc'); const isD=v=>/^\d{4}-\d{2}/.test(String(v)); return rows.slice().sort((a,b)=>{ let x=a[col], y=b[col]; const nx=parseFloat(x), ny=parseFloat(y); if(isD(x)&&isD(y)){ x=String(x); y=String(y); } else if(!isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!==''){ x=nx; y=ny; } else { x=String(x??'').toLowerCase(); y=String(y??'').toLowerCase(); } return (x<y?-1:x>y?1:0)*(dir==='asc'?1:-1); }); }
  function thdr(view, cols, gtc, top){ const s=TSORT[view]||{}; return `<div class="xh" style="grid-template-columns:${gtc};top:${top||0}">` + cols.map(c=>`<div ${c.k?`onclick=\"APP.tsortGo('${view}','${c.k}')\"`:''} style="${c.r?'text-align:right;':''}${s.col===c.k?'color:var(--navy);':''}">${c.l}${c.k?(s.col===c.k?(s.dir==='asc'?' ▲':' ▼'):' ↕'):''}</div>`).join('') + '</div>'; }

  function toast(msg, err) {
    const t = document.createElement('div');
    t.className = 'toast' + (err?' err':''); t.textContent = msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(), err?5000:2600);
  }

  // ---------------- boot ----------------
  async function boot() {
    const email = await EMS2.getAuthedEmail();
    if (!email) { location.replace('home.html'); return; }
    try {
      const d = await EMS2.callAPI('myday', {});   // rpc api_myday
      S.myday = d; S.me = d.employee; S.isApprover = !!d.isApprover;
      S.isAdmin = (d.employee && d.employee['Role']) === 'admin';
      $('uName').textContent = S.me['Employee Name'] || email;
      $('uRole').textContent = (S.me['Designation']||'') + (S.isAdmin?' · Admin':S.isApprover?' · Approver':'');
      $('uAv').textContent = (S.me['Employee Name']||email).split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      buildNav();
      show(S.isApprover ? 'dashboard' : 'myday');
    } catch (e) {
      $('view').innerHTML = '<div class="card" style="margin-top:20px"><b>Could not load.</b><div class="sub" style="margin-top:6px">'+h(e.message)+'</div><button class="btn" style="margin-top:12px" onclick="location.reload()">Retry</button></div>';
    }
  }

  // ---------------- nav ----------------
  const VIEWS = () => [
    S.isApprover && { id:'dashboard', icon:'📊', label:'Dashboard' },
    S.isApprover && { id:'approvals', icon:'✅', label:'Approvals', badge:()=>S.cache.dashboard?( (S.cache.dashboard.approvals.leaves.length + S.cache.dashboard.approvals.expenses.length) || null):null },
    { id:'review', icon:'🔎', label:'Review' },
    { id:'myday', icon:'☀️', label:'My Day', dot:()=>missingYday() },
    { id:'timesheet', icon:'🗓', label:'Timesheet' },
    { id:'workplan', icon:'📋', label:'Work Plan' },
    { id:'leave', icon:'🌴', label:'Leave' },
    { id:'expenses', icon:'💳', label:'Expenses' },
    S.isAdmin && { id:'admin', icon:'⚙️', label:'Admin', href:'admin.html' },
    { id:'legacy', icon:'⋯', label:'Classic pages', href:'home.html' }
  ].filter(Boolean);

  function missingYday() {
    const w = S.myday && S.myday.week; if (!w || w.length < 2) return false;
    const y = w[w.length-2];
    return !y.isSunday && !y.isHoliday && (+y.hours||0) === 0;
  }

  function buildNav() {
    $('nav').innerHTML = VIEWS().map(v => v.href
      ? `<a class="nitem" style="text-decoration:none" href="${v.href}"><span>${v.icon}</span><span class="lbl">${v.label}</span></a>`
      : `<button class="nitem${S.view===v.id?' on':''}" onclick="APP.show('${v.id}')"><span>${v.icon}</span><span class="lbl">${v.label}</span>${v.badge&&v.badge()?`<span class="bdg">${v.badge()}</span>`:''}${v.dot&&v.dot()?'<span class="dot"></span>':''}</button>`
    ).join('');
  }

  const TITLES = { myday:'My Day', dashboard:'Dashboard', approvals:'Approvals', review:'Review', timesheet:'Timesheet', workplan:'Work Plan', leave:'Leave', expenses:'Expenses' };

  async function show(id) {
    S.view = id; buildNav();
    $('vTitle').textContent = TITLES[id] || id;
    $('vDate').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    $('view').innerHTML = '<div class="grid" style="grid-template-columns:2fr 1fr;margin-top:4px"><div class="skel" style="height:180px"></div><div class="skel" style="height:180px"></div></div>';
    try { await RENDER[id](); } catch (e) { $('view').innerHTML = '<div class="card"><b>Error:</b> '+h(e.message)+' <button class="btn2" onclick="APP.show(\''+id+'\')">Retry</button></div>'; }
  }

  // masters (assignments etc.) cached for quick entry
  async function masters(force) {
    if (S.masters && !force) return S.masters;
    S.masters = await EMS2.callAPI('initTimesheet', {});
    return S.masters;
  }

  // ---------------- MY DAY ----------------
  async function rMyday() {
    const d = S.myday = await EMS2.callAPI('myday', {});
    const t = d.today, wk = d.week || [];
    const planned = (t.planned||[]).filter(p=>!p.logged);
    const pct = Math.min(100, Math.round(100*(+t.loggedTotal||0)/6));
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:1.4fr 1fr">
      <div class="card">
        <div style="display:flex;align-items:baseline;gap:10px"><span class="h">Today</span>
          <span class="sub">${fmt1(t.loggedTotal)}h logged of 6h${t.loggedTotal<6?' · '+fmt1(6-t.loggedTotal)+'h to go':''}</span></div>
        <div style="margin-top:10px;height:10px;background:var(--line2);border-radius:99px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${t.loggedTotal>=6?'var(--ok)':'var(--gold)'}"></div></div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">
          ${(t.entries||[]).map(e=>`<div style="display:flex;align-items:center;gap:10px;font:500 12px Inter">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none"></span>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(e.Client)} — ${h(e.Task)} · <b>${fmt1(e.Hours)}h</b>${e.Location?' · '+h(e.Location):''}</span></div>`).join('') || '<div class="sub">Nothing logged yet today.</div>'}
          ${planned.map(p=>`<div style="display:flex;align-items:center;gap:10px;font:500 12px Inter;color:var(--goldd);background:var(--goldbg);border:1px dashed var(--goldline);border-radius:8px;padding:7px 10px">
            ⚠️ Planned, not logged: ${h(p.client)} — ${h(p.task)} · ${fmt1(p.hours)}h
            <button class="btn" style="margin-left:auto;padding:4px 10px;font-size:11px" onclick='APP.logPlan(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Log it</button></div>`).join('')}
        </div>
      </div>
      <div class="card"><div class="h" style="margin-bottom:10px">Quick entry</div><div id="qe"></div></div>
      <div class="card">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px"><span class="h">Last 7 days</span><span class="sub">ending today · 6h standard day</span>
          <span style="margin-left:auto" class="sub"><b style="color:var(--ok)">${fmt1(wk.reduce((s,x)=>s+(+x.hours||0),0))}h</b> logged</span></div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
          ${wk.map(x=>{
            const off = x.isSunday || x.isHoliday;
            const bg = x.isToday ? 'var(--goldbg);border:1px solid var(--goldline)' : off ? 'var(--line2)' : (+x.hours>=6 ? 'var(--okbg)' : +x.hours>0 ? 'var(--badbg)' : '#f1f5f9');
            const col = x.isToday ? 'var(--goldd)' : off ? 'var(--fog)' : +x.hours>=6 ? 'var(--ok)' : +x.hours>0 ? 'var(--bad)' : 'transparent';
            return `<div style="text-align:center"><div style="height:52px;background:${bg};border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 13px Inter;color:${col}">${off? '🏖' : (+x.hours? fmt1(x.hours):'')}</div><div style="font:500 10px Inter;color:${x.isToday?'var(--navy)':'var(--fog)'};margin-top:4px">${x.dayName} ${x.dayNum}${x.isToday?' · today':''}</div></div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="h" style="margin-bottom:10px">My month</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div><div style="font:800 20px Inter;color:var(--navy)">${fmt1(d.month.hours)}</div><div class="sub">hours logged</div></div>
          <div><div style="font:800 20px Inter;color:var(--ok)">${fmt1(d.month.billablePct)}%</div><div class="sub">billable</div></div>
          <div><div style="font:800 20px Inter;color:var(--goldd)">${fmt1(d.plBalance)}</div><div class="sub">PL balance</div></div>
        </div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;font:500 12px Inter">
          ${(d.pendings.leaves||[]).map(l=>`<div>🌴 ${h(l['Leave Type'])} ${fmtD(l['From Date'])} → ${fmtD(l['To Date'])} — <b style="color:${l.Status==='Approved'?'var(--ok)':'var(--goldd)'}">${h(l.Status)}</b></div>`).join('') || '<div class="sub">No upcoming leaves.</div>'}
        </div>
      </div>
    </div>`;
    renderQuickEntry('qe');
    buildNav();
  }

  // quick entry (shared by My Day and modal)
  async function renderQuickEntry(mountId, prefill) {
    const m = await masters();
    const asg = m.assignments || [];
    const clients = [...new Set(asg.map(a=>a['Client Name']))].sort();
    const lastLoc = localStorage.getItem('ems2_lastloc') || '';
    const el = $(mountId);
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="qe_loc"><option value="">📍 Location…</option>${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${l===(prefill&&prefill.location||lastLoc)?'selected':''}>${l}</option>`).join('')}</select>
        <select id="qe_client"><option value="">Client…</option>${clients.map(c=>`<option ${prefill&&prefill.client===c?'selected':''}>${h(c)}</option>`).join('')}</select>
        <select id="qe_task"><option value="">Task…</option></select>
        <input id="qe_hours" type="number" step="0.5" min="0.5" max="24" placeholder="Hours" value="${prefill&&prefill.hours||''}">
        <textarea id="qe_desc" rows="2" placeholder="What did you work on?" style="grid-column:1/-1"></textarea>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
        <button class="btn" id="qe_add">Add entry</button>
        <button class="btn2" id="qe_copy">↺ Copy yesterday</button>
        <span id="qe_st" class="sub"></span>
      </div>`;
    const taskSel = $('qe_task');
    function fillTasks() {
      const c = $('qe_client').value;
      const tasks = [...new Set(asg.filter(a=>a['Client Name']===c).map(a=>a['Task Assigned']))].sort();
      taskSel.innerHTML = '<option value="">Task…</option>' + tasks.map(t=>`<option ${prefill&&prefill.task===t?'selected':''}>${h(t)}</option>`).join('');
    }
    $('qe_client').onchange = fillTasks; if (prefill&&prefill.client || clients.length) fillTasks();
    $('qe_copy').onclick = async () => {
      const y = (m.timesheets||[]).filter(e=>!e.Auto).sort((a,b)=>b.Date<a.Date?-1:1);
      const last = y.find(e=>e.Date < (S.myday.today.date));
      if (!last) return toast('No earlier entry to copy', true);
      $('qe_loc').value = last.Location||lastLoc; $('qe_client').value = last.Client; fillTasks();
      $('qe_task').value = last.Task; $('qe_hours').value = last.Hours; $('qe_desc').value = last.Description||'';
    };
    $('qe_add').onclick = async () => {
      const payload = { timesheet: {
        employeeEmail: S.me['Employee Email'], date: S.myday.today.date,
        client: $('qe_client').value, task: $('qe_task').value,
        hours: $('qe_hours').value, description: $('qe_desc').value.trim(),
        location: $('qe_loc').value, expenseType:'Not Applicable', expenseAmount:'0' } };
      if (!payload.timesheet.location) return toast('Select a location', true);
      if (!payload.timesheet.client || !payload.timesheet.task) return toast('Select client and task', true);
      if (!(+payload.timesheet.hours > 0)) return toast('Enter hours', true);
      $('qe_add').disabled = true; $('qe_st').textContent = 'Saving…';
      try {
        if (prefill && prefill.rowId && prefill.edit) { payload.timesheet.rowId = prefill.rowId; await EMS2.callAPI('updateTimesheet', payload); }
        else await EMS2.callAPI('addTimesheet', payload);
        localStorage.setItem('ems2_lastloc', payload.timesheet.location);
        S.masters = null; toast('Entry saved ✓');
        const tot = (+S.myday.today.loggedTotal||0) + (+payload.timesheet.hours);
        if (tot < 6) toast('Day total ' + fmt1(tot) + 'h — remember your 6h day');
        else if (tot > 6) toast('Day total ' + fmt1(tot) + 'h — above the standard day');
        rMyday();

  function openAppr(kind, id) {
    const d = S.cache.dashboard; if (!d) return;
    const list = kind==='leave' ? d.approvals.leaves : d.approvals.expenses;
    const it = (list||[]).find(x=>String(x['Row ID'])===String(id)); if (!it) return;
    const F = (l,v)=>`<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line2)"><span class="sub" style="width:140px;flex:none">${l}</span><span style="font:500 12.5px Inter;min-width:0">${v||'—'}</span></div>`;
    const body = kind==='leave'
      ? F('Employee',h(it['Employee Name']))+F('Leave type',h(it['Leave Type'])+(it['Auto LOP']==='Yes'?' (Auto LOP)':''))+F('Day type',h(it['Day Type']))+F('From',fmtD(it['From Date']))+F('To',fmtD(it['To Date']))+F('Working days',fmt1(it['Total Days']))+F('Reason',h(it['Reason']))+F('Applied on',h(it['Applied On']))
      : F('Employee',h(it['Employee Name']))+F('Date',fmtD(it.Date))+F('Type',h(it['Expense Type']))+F('Amount','₹'+fmt1(it.Amount))+F('Client',h(it['Client Name']))+F('Reimbursement by',h(it['Reimbursement By']))+F('Receipt ref',h(it['Receipt Reference']))+F('Description',h(it.Description))+F('Submitted on',h(it['Submitted On']));
    modal((kind==='leave'?'Leave':'Expense')+' application', body +

  async function actGo(kind, what, id) {
    const cEl = $('ap_cmt');
    const comments = (cEl && cEl.value.trim()) || '';
    if (what==='reject' && !sane(comments)) return toast('Rejection needs a ' + SANE_HINT, true);
    closeModal();
    try {
      await EMS2.callAPI((what==='approve'?'approve':'reject')+(kind==='leave'?'Leave':'Expense'),
        { rowId: id, approverEmail: S.me['Employee Email'], approverName: S.me['Employee Name'], comments });
      toast((what==='approve'?'Approved':'Rejected')+' ✓');
      delete BULK[kind][id];
      await dashData(true); buildNav(); RENDER[S.view]();
    } catch (e) { toast(e.message, true); }
  }

  function selAppr(kind, id, on) { if (on) BULK[kind][id] = 1; else delete BULK[kind][id]; RENDER.approvals(); }

  async function bulkApprove(kind) {
    const ids = Object.keys(BULK[kind]);
    if (!ids.length) return;
    if (!confirm('Approve ' + ids.length + ' selected ' + (kind==='leave'?'leave(s)':'expense(s)') + '?')) return;
    let ok = 0;
    for (const id of ids) {
      try {
        await EMS2.callAPI('approve'+(kind==='leave'?'Leave':'Expense'),
          { rowId: id, approverEmail: S.me['Employee Email'], approverName: S.me['Employee Name'], comments: '' });
        ok++;
      } catch (e) { toast(e.message, true); }
    }
    BULK[kind] = {};
    toast('Approved ' + ok + ' of ' + ids.length);
    await dashData(true); buildNav(); RENDER[S.view]();
  }

  // ---------------- REVIEW TABLE ----------------
  const RT = { month:null, person:'', client:'', location:'', search:'', sort:'date', dir:'desc', cursor:0, rows:[], totals:null, people:[], clients:[], busy:false, done:false };

  async function rtLoad(reset) {
    if (RT.busy) return; RT.busy = true;
    if (reset) { RT.cursor = 0; RT.rows = []; RT.done = false; }
    const r = await EMS2.callAPI('review_table', { month:RT.month, person:RT.person, client:RT.client, location:RT.location, search:RT.search, sort:RT.sort, dir:RT.dir, cursor:String(RT.cursor||0) });
    RT.rows = RT.rows.concat(r.rows||[]); RT.totals = r.totals;
    if (reset) { RT.people = r.people||[]; RT.clients = r.clients||[]; }
    RT.done = !r.nextCursor; RT.cursor = r.nextCursor ? +r.nextCursor : RT.cursor;
    RT.busy = false;
  }

  const RT_COLS = [ ['date','Date','96px'], ['person','Person','150px'], ['client','Client','1fr'], ['task','Task','150px'], ['hours','Hrs','64px'], ['location','Location','96px'], ['desc','Description','1.4fr'] ];

  async function rReview() {
    if (!RT.month) { const t = new Date(); RT.month = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-01'; }
    await rtLoad(true);
    renderReview();
  }

  function renderReview() {
    const gtc = RT_COLS.map(c=>c[2]).join(' ');
    const personSel = S.isApprover ? `<select id="rt_person" style="width:170px"><option value="">Person: All</option>${RT.people.map(p=>`<option ${p===RT.person?'selected':''}>${h(p)}</option>`).join('')}</select>` : '';
    $('view').innerHTML = `
    <div class="card" style="padding:0;overflow:visible">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <input type="month" id="rt_month" value="${RT.month.slice(0,7)}" style="width:150px">
        ${personSel}
        <select id="rt_client" style="width:200px"><option value="">Client: All</option>${RT.clients.map(c=>`<option ${c===RT.client?'selected':''}>${h(c)}</option>`).join('')}</select>
        <select id="rt_loc" style="width:130px"><option value="">Location: All</option>${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${l===RT.location?'selected':''}>${l}</option>`).join('')}</select>

        <span class="sub" style="margin-left:auto">${RT.rows.length} of ${RT.totals?RT.totals.rows:0} rows</span>
        <button class="btn2" onclick="APP.rtCSV()">⬇ CSV</button>
      </div>
      <div class="xt">
        <div class="xh" style="grid-template-columns:${gtc}">${RT_COLS.map(c=>{
          const sortable = c[0]!=='desc';
          const on = RT.sort===c[0];
          return `<div ${sortable?`onclick=\"APP.rtSort('${c[0]}')\"`:''} style="${c[0]==='hours'?'text-align:right;':''}${on?'color:var(--navy);':''}">${c[1]}${sortable?(on?(RT.dir==='asc'?' ▲':' ▼'):' ↕'):''}</div>`;}).join('')}</div>
        <div id="rt_body">${rtRows()}</div>
        <div style="display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);font:600 11.5px Inter;color:#486581">
          <span>Σ ${RT.totals?RT.totals.rows:0} rows · <b style="color:var(--navy)">${RT.totals?fmt1(RT.totals.hours):0} hours</b> · ${RT.totals?fmt1(RT.totals.billablePct):0}% billable</span>
          <span style="margin-left:auto" class="sub">${RT.done?'All rows loaded':'Scroll for more…'}</span>
        </div>
      </div>
    </div>`;
    $('rt_month').onchange = e => { RT.month = e.target.value + '-01'; rtLoad(true).then(renderReview); };
    const _ps = $('rt_person'); if (_ps) _ps.onchange = e => { RT.person = e.target.value; rtLoad(true).then(renderReview); };
    $('rt_client').onchange = e => { RT.client = e.target.value; rtLoad(true).then(renderReview); };
    $('rt_loc').onchange = e => { RT.location = e.target.value; rtLoad(true).then(renderReview); };
    let deb; $('rt_q').oninput = e => { clearTimeout(deb); deb = setTimeout(()=>{ RT.search = e.target.value.trim(); rtLoad(true).then(renderReview); }, 350); };
    window.onscroll = () => {
      if (S.view!=='review' || RT.done || RT.busy) return;
      if (window.innerHeight + window.scrollY > document.body.offsetHeight - 400) {
        rtLoad(false).then(()=>{ $('rt_body').innerHTML = rtRows(); });
      }

    const gtc = RT_COLS.map(c=>c[2]).join(' ');

  async function rtCSV() {
    toast('Preparing CSV…');
    while (!RT.done && RT.rows.length < 5000) { await rtLoad(false); }
    const heads = ['Date','Person','Client','Task','Hours','Location','Description'];
    const esc = v => '"' + String(v??'').replace(/"/g,'""') + '"';

        <button class="btn" style="margin-left:auto" onclick="APP.wpForm()">+ Plan work</button></div>
      <div class="xt">
        <div class="xh" style="grid-template-columns:${gtc};top:0"><div>From</div><div>To</div><div>Client</div><div>Task</div><div style="text-align:right">h/d</div><div>Location</div><div>Description</div><div>Off-days</div><div></div></div>
        ${rows.map(w=>{
          const fut = w['From Date'] >= today, inprog = !fut && w['To Date'] >= today;
          const acts = fut
            ? `<button class=\"btn2\" style=\"padding:2px 8px;font-size:11px\" onclick='APP.wpForm(${JSON.stringify(w).replace(/'/g,"&#39;")},"update")'>Edit</button> <button class=\"btn2\" style=\"padding:2px 8px;font-size:11px;color:var(--bad)\" onclick=\"APP.wpDel('${w['Row ID']}')\">Del</button>`
            : inprog ? `<button class=\"btn2\" style=\"padding:2px 8px;font-size:11px\" onclick='APP.wpForm(${JSON.stringify(w).replace(/'/g,"&#39;")},"revise")'>Revise</button> <button class=\"btn2\" style=\"padding:2px 8px;font-size:11px;color:var(--goldd)\" onclick=\"APP.wpEnd('${w['Row ID']}')\">End</button>` : '';
          return `<div class="xr" style="grid-template-columns:${gtc}">
            <div style="color:var(--mut)">${fmtD(w['From Date'])}</div><div style="color:var(--mut)">${fmtD(w['To Date'])}</div>
            <div>${h(w.Client)}</div><div>${h(w.Task)}</div><div class="num">${fmt1(w['Daily Hours'])}</div>
            <div style="color:var(--mut)">${h(w.Location||'—')}</div><div style="color:#486581" title="${h(w.Description)}">${h(w.Description||'')}</div>
            <div>${w['Include Off Days']==='Yes'?'<span class="pill" style="background:var(--goldbg);color:var(--goldd)">Yes</span>':'<span class="sub">No</span>'}</div>
            <div style="white-space:nowrap">${acts}</div></div>`;}).join('') || '<div style="padding:24px" class="sub">No plan yet — click + Plan work.</div>'}
      </div>
    </div>
    ${S.isApprover?'<div class="sub" style="margin-top:10px">Team 30-day grid: sidebar → Classic pages → Work Plan → Team View (v2 grid comes with Team Planning).</div>':''}`;
  }

  function wpForm(w, mode) {
    const d = S.cache.wp; const isEdit = !!w;
    const clients = (d.clients||[]).map(c=>c['Client Full Name']).filter(Boolean).sort();
    const inner = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="grid-column:1/-1"><label class="sub">Client</label><select id="wp_client">${clients.map(c=>`<option ${w&&w.Client===c?'selected':''}>${h(c)}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Task</label><select id="wp_task">${(d.taskTypes||[]).map(t=>`<option ${w&&w.Task===t?'selected':''}>${h(t)}</option>`).join('')}</select></div>
        <div><label class="sub">From</label><input type="date" id="wp_from" value="${w?w['From Date']:''}"></div>
        <div><label class="sub">To</label><input type="date" id="wp_to" value="${w?w['To Date']:''}"></div>
        <div><label class="sub">Hours/day (≤6)</label><input type="number" id="wp_hrs" step="0.5" min="0.5" max="6" value="${w?w['Daily Hours']:'6'}"></div>
        <div><label class="sub">Location</label><select id="wp_loc">${['Office','Client Place','WFH','Travelling'].map(l=>`<option ${w&&w.Location===l?'selected':''}>${l}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Description (2–100 chars)</label><input id="wp_desc" maxlength="100" value="${w?h(w.Description||''):''}"></div>
        <label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font:500 12px Inter"><input type="checkbox" id="wp_off" style="width:auto" ${w&&w['Include Off Days']==='Yes'?'checked':''}> Include Sundays &amp; holidays on purpose</label>
      </div>
      <div style="margin-top:14px;display:flex;gap:10px"><button class="btn" id="wp_save">${mode==='revise'?'Revise from today':isEdit?'Update':'Add plan'}</button></div>`;
    modal(mode==='revise'?'Revise plan (past days stay frozen)':isEdit?'Edit plan':'Plan work', inner);
    $('wp_save').onclick = async () => {
      const entry = { employeeEmail: S.me['Employee Email'], client: $('wp_client').value, task: $('wp_task').value,
        fromDate: $('wp_from').value, toDate: $('wp_to').value, dailyHours: $('wp_hrs').value,
        location: $('wp_loc').value, description: $('wp_desc').value.trim(), includeOffDays: $('wp_off').checked ? 'Yes' : 'No' };
      if (isEdit) entry.rowId = w['Row ID'];
      const action = mode==='revise' ? 'reviseWorkPlanEntry' : isEdit ? 'updateWorkPlanEntry' : 'addWorkPlanEntry';
      $('wp_save').disabled = true;
      try { await EMS2.callAPI(action, { entry }); closeModal(); toast('Plan saved ✓'); rWorkplan(); }
      catch (e) { toast(e.message, true); $('wp_save').disabled = false; }
    };
  }

  async function wpEnd(rowId) {
    if (!confirm('End this plan as of yesterday?')) return;
    try { await EMS2.callAPI('endWorkPlanEntry', { rowId, email: S.me['Employee Email'] }); toast('Ended ✓'); rWorkplan(); }
    catch (e) { toast(e.message, true); }
  }
  async function wpDel(rowId) {
    if (!confirm('Delete this future plan?')) return;
    try { await EMS2.callAPI('deleteWorkPlanEntry', { rowId, email: S.me['Employee Email'] }); toast('Deleted ✓'); rWorkplan(); }
    catch (e) { toast(e.message, true); }
  }

  // ---------------- LEAVE ----------------
  async function rLeave() {
    const d = await EMS2.callAPI('initLeave', {});
    const b = d.leaveBalance || {};
    const gtc = '110px 92px 92px 64px 90px 1.2fr 110px 90px';
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:repeat(5,1fr)">
      ${[['plBalance','PL Available','var(--ok)'],['plEarned','PL Earned','var(--navy)'],['plUsed','PL Used','var(--goldd)'],['completedMonths','Months Service','var(--mut)'],['plMaxCap','Max PL Cap','var(--fog)']].map(x=>`<div class="card"><div style="font:800 22px Inter;color:${x[2]}">${fmt1(b[x[0]])}</div><div class="sub">${x[1]}</div></div>`).join('')}
    </div>
    <div class="grid" style="grid-template-columns:1fr 340px;margin-top:12px">
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:12px 16px;border-bottom:1px solid var(--line)"><span class="h">My applications</span></div>
        <div class="xt"><div class="xh" style="grid-template-columns:${gtc};top:0"><div>Type</div><div>From</div><div>To</div><div style="text-align:right">Days</div><div>Status</div><div>Reason</div><div>Approver</div><div></div></div>
        ${(d.leaves||[]).map(l=>`<div class="xr" style="grid-template-columns:${gtc}">
          <div>${h(l['Leave Type'])}${l['Auto LOP']==='Yes'?' <span class="pill" style="background:var(--badbg);color:var(--bad)">auto</span>':''}</div>
          <div style="color:var(--mut)">${fmtD(l['From Date'])}</div><div style="color:var(--mut)">${fmtD(l['To Date'])}</div>
          <div class="num">${fmt1(l['Total Days'])}</div>
          <div><span class="pill" style="background:${l.Status==='Approved'?'var(--okbg)':l.Status==='Pending'?'var(--goldbg)':'var(--line2)'};color:${l.Status==='Approved'?'var(--ok)':l.Status==='Pending'?'var(--goldd)':'var(--mut)'}">${h(l.Status)}</span></div>
          <div style="color:#486581" title="${h(l.Reason)}">${h(l.Reason||'')}</div><div style="color:var(--mut)">${h(l['Approver Name']||'—')}</div>
          <div>${l.Status==='Pending'?`<button class=\"btn2\" style=\"padding:2px 8px;font-size:11px;color:var(--bad)\" onclick=\"APP.lvCancel('${l['Row ID']}')\">Cancel</button>`:''}</div>
        </div>`).join('') || '<div style="padding:24px" class="sub">No applications yet.</div>'}</div>
      </div>
      <div class="card" style="align-self:start">
        <div class="h" style="margin-bottom:10px">Apply for leave</div>
        <div style="display:grid;gap:8px">
          <select id="lv_type"><option>PL</option><option>LOP</option></select>
          <select id="lv_day"><option>Full Day</option><option>Half Day</option></select>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input type="date" id="lv_from"><input type="date" id="lv_to"></div>
          <textarea id="lv_reason" rows="2" placeholder="Reason (min 10 characters)"></textarea>
          <button class="btn" id="lv_apply">Apply</button>
        </div>
      </div>
    </div>`;
    $('lv_apply').onclick = async () => {
      $('lv_apply').disabled = true;
      try {
        const r = await EMS2.callAPI('applyLeave', { leave: { employeeEmail: S.me['Employee Email'], employeeName: S.me['Employee Name'],
          leaveType: $('lv_type').value, dayType: $('lv_day').value, fromDate: $('lv_from').value, toDate: $('lv_to').value, reason: $('lv_reason').value.trim() } });
        toast(r.autoLOP==='Yes' ? 'Applied — converted to LOP (PL balance short)' : 'Leave applied ✓');
        rLeave();
      } catch (e) { toast(e.message, true); $('lv_apply').disabled = false; }
    };
  }
  async function lvCancel(rowId) {
    if (!confirm('Cancel this application?')) return;
    try { await EMS2.callAPI('cancelLeave', { rowId, email: S.me['Employee Email'] }); toast('Cancelled ✓'); rLeave(); }
    catch (e) { toast(e.message, true); }
  }

  // ---------------- EXPENSES ----------------
  async function rExpenses() {
    const d = S.cache.exp || (S.cache.exp = await EMS2.callAPI('initExpense', {}));
    if (!S.exMonth) S.exMonth = S.myday.today.date.slice(0,7);
    const all = d.expenses || [];
    const months = [...new Set(all.map(x=>String(x.Date||'').slice(0,7)))].filter(Boolean);
    if (!months.includes(S.exMonth)) months.push(S.exMonth);
    months.sort().reverse();
    const mine = all.filter(x=>String(x.Date||'').startsWith(S.exMonth));
    const sum = st => mine.filter(x=>!st||x.Status===st).reduce((s,x)=>s+(+x.Amount||0),0);
    const F = TSORT['exp'] = TSORT['exp']||{};
    let rows = mine;
    if (F.ftype) rows = rows.filter(x=>x['Expense Type']===F.ftype);
    if (F.fstatus) rows = rows.filter(x=>x.Status===F.fstatus);
    rows = applySort('exp', tq('exp', rows), 'Date', 'desc');
    const gtc = '86px 120px 84px 1.4fr 160px 100px 92px 118px';
    const cols = [{k:'Date',l:'Date'},{k:'Expense Type',l:'Type'},{k:'Amount',l:'₹',r:1},{k:'Description',l:'Description'},{k:'Client Name',l:'Client'},{k:'Reimbursement By',l:'Reimb.'},{k:'Status',l:'Status'},{l:''}];
    const types = [...new Set(all.map(x=>x['Expense Type']).filter(Boolean))].sort();
    $('view').innerHTML = `
    <div class="grid" style="grid-template-columns:170px repeat(4,1fr)">
      <div class="card"><div class="sub" style="margin-bottom:6px">Month</div><select onchange="APP.exMonthGo(this.value)">${months.map(m=>`<option value="${m}" ${m===S.exMonth?'selected':''}>${fmtM(m)}</option>`).join('')}</select></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--navy)">₹${fmt1(sum())}</div><div class="sub">Claimed</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--ok)">₹${fmt1(sum('Approved'))}</div><div class="sub">Approved</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--bad)">₹${fmt1(sum('Rejected'))}</div><div class="sub">Rejected</div></div>
      <div class="card"><div style="font:800 22px Inter;color:var(--goldd)">₹${fmt1(sum('Pending'))}</div><div class="sub">Pending</div></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;margin-top:12px">
      <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="h">My expenses</span><span class="sub">${fmtM(S.exMonth)}</span>
        <select style="width:150px;margin-left:12px" onchange="APP.fGo('exp','ftype',this.value)"><option value="">Type: All</option>${types.map(t=>`<option ${t===F.ftype?'selected':''}>${h(t)}</option>`).join('')}</select>
        <select style="width:130px" onchange="APP.fGo('exp','fstatus',this.value)"><option value="">Status: All</option>${['Pending','Approved','Rejected','Cancelled'].map(s=>`<option ${s===F.fstatus?'selected':''}>${s}</option>`).join('')}</select>
        <input id="q_exp" style="width:170px" placeholder="🔍 Search…" value="${h(F.q||'')}" oninput="APP.qGo('exp', this.value)">
        <button class="btn" style="margin-left:auto" onclick="APP.exForm()">+ Submit expense</button>
      </div>
      <div class="xt">
        ${thdr('exp', cols, gtc)}
        ${rows.map(x=>{
          const p = x.Status==='Pending';
          return `<div class="xr" style="grid-template-columns:${gtc}">
          <div style="color:var(--mut)">${fmtD(x.Date)}</div><div>${h(x['Expense Type'])}</div><div class="num">${fmt1(x.Amount)}</div>
          <div style="color:#486581" title="${h(x.Description)}">${h(x.Description||'')}</div><div style="color:var(--mut)">${h(x['Client Name']||'—')}</div>
          <div style="color:var(--mut)">${h(x['Reimbursement By']||'')}</div>
          <div><span class="pill" style="background:${x.Status==='Approved'?'var(--okbg)':p?'var(--goldbg)':'var(--line2)'};color:${x.Status==='Approved'?'var(--ok)':p?'var(--goldd)':'var(--mut)'}">${h(x.Status)}</span></div>
          <div style="white-space:nowrap">${p?`<button class=\"btn2\" style=\"padding:2px 8px;font-size:11px\" onclick='APP.exForm(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Edit</button> <button class=\"btn2\" style=\"padding:2px 8px;font-size:11px;color:var(--bad)\" onclick=\"APP.exCancel('${x['Row ID']}')\">Cancel</button>`:''}</div>
        </div>`;}).join('') || '<div style="padding:24px" class="sub">No expenses this month.</div>'}
        <div style="display:flex;gap:16px;padding:10px 16px;background:var(--bg);border-top:1px solid var(--line);font:600 11.5px Inter;color:#486581"><span>Σ ${rows.length} rows · <b style="color:var(--navy)">₹${fmt1(rows.reduce((s,x)=>s+(+x.Amount||0),0))}</b></span></div>
      </div>
    </div>`;
  }
  async function exCancel(rowId) {
    if (!confirm('Cancel this expense?')) return;
    try { await EMS2.callAPI('cancelExpense', { rowId, email: S.me['Employee Email'] }); S.cache.exp = null; toast('Cancelled ✓'); rExpenses(); }
    catch (e) { toast(e.message, true); }
  }

  function exForm(x) {
    const d = S.cache.exp || {}; const isEdit = !!x;
    const types = (d.expenseTypes||[]).map(t=>t['Expense Type']).filter(Boolean);
    const clients = (d.clients||[]).map(c=>c['Client Full Name']).filter(Boolean);
    modal(isEdit?'Edit expense':'Submit expense', `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label class="sub">Date (within 7 days)</label><input type="date" id="ex_date" value="${x?x.Date:''}"></div>
        <div><label class="sub">Type</label><select id="ex_type"><option value="">Type…</option>${types.map(t=>`<option ${x&&x['Expense Type']===t?'selected':''}>${h(t)}</option>`).join('')}</select></div>
        <div><label class="sub">Amount ₹</label><input type="number" id="ex_amt" min="1" step="0.01" value="${x?x.Amount:''}"></div>
        <div><label class="sub">Reimbursement by</label><select id="ex_by" onchange="document.getElementById('ex_cli_row').style.display=this.value==='Client'?'':'none'"><option value="">Select…</option>${['Client','DRP & Co. LLP'].map(v=>`<option ${x&&x['Reimbursement By']===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div id="ex_cli_row" style="grid-column:1/-1;display:${x&&x['Reimbursement By']==='Client'?'':'none'}"><label class="sub">Client</label><select id="ex_client"><option value="">Client…</option>${clients.map(c=>`<option ${x&&x['Client Name']===c?'selected':''}>${h(c)}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label class="sub">Receipt reference</label><input id="ex_ref" value="${x?h(x['Receipt Reference']||''):''}"></div>
        <div style="grid-column:1/-1"><label class="sub">Description — ${SANE_HINT}</label><textarea id="ex_desc" rows="2">${x?h(x.Description||''):''}</textarea></div>
      </div>
      <div style="margin-top:14px"><button class="btn" id="ex_save">${isEdit?'Update':'Submit'}</button></div>`);
    $('ex_save').onclick = async () => {
      const desc = $('ex_desc').value.trim();
      if (!$('ex_date').value) return toast('Pick the date', true);
      if (!$('ex_type').value) return toast('Pick the type', true);
      if (!(+$('ex_amt').value > 0)) return toast('Enter a valid amount', true);
      if (!$('ex_by').value) return toast('Select who reimburses', true);
      if ($('ex_by').value==='Client' && !$('ex_client').value) return toast('Select the client', true);
      if ($('ex_ref').value.trim().length < 3) return toast('Receipt reference required', true);
      if (!sane(desc)) return toast('Description must be a ' + SANE_HINT, true);
      const expense = { employeeEmail: S.me['Employee Email'], employeeName: S.me['Employee Name'],
        date: $('ex_date').value, expenseType: $('ex_type').value, amount: parseFloat($('ex_amt').value),
        description: desc, reimbursementBy: $('ex_by').value, clientName: $('ex_client').value, receiptReference: $('ex_ref').value.trim() };
      if (isEdit) expense.rowId = x['Row ID'];
      $('ex_save').disabled = true;
      try { await EMS2.callAPI(isEdit?'updateExpense':'submitExpense', { expense }); closeModal(); S.cache.exp = null; toast(isEdit?'Updated ✓':'Submitted ✓'); rExpenses(); }
      catch (e) { toast(e.message, true); $('ex_save').disabled = false; }
    };
  }

  function exMonthGo(v) { S.exMonth = v; rExpenses(); }

  const RENDER = { myday:rMyday, dashboard:rDashboard, approvals:rApprovals, review:rReview, timesheet:rTimesheet, workplan:rWorkplan, leave:rLeave, expenses:rExpenses };

  async function signout() { await EMS2.signOut(); location.replace('home.html'); }

  boot();
  return { show, signout, quickLog, logPlan, actGo, openAppr, selAppr, bulkApprove, rfshAppr, tsortGo: tsort, qGo, fGo, exForm, exMonthGo, rtSort, rtCSV, tsEdit, tsDel, wpForm, wpEnd, wpDel, lvCancel, exCancel, S, RENDER, masters, renderQuickEntry, h, fmt1, toast, $ };
})();
</script>
</body>
</html>
