<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>TimeWise EMS | Home</title>
    <!-- ============================================
    TimeWise EMS - Home Dashboard
    Version: 2.0
    Last Updated: 15-Mar-2026
    UI: Redesigned with drpca.com branding
    Note: All JS logic preserved from original
    ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 700: '#334e68', 800: '#243b53', 900: '#102a43' },
                        gold: { 50: '#fdf9ef', 100: '#faf0d7', 400: '#e3b04a', 500: '#d4a853', 600: '#c4882c' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
        .module-card { transition: all 0.2s ease; border: 1px solid #e5e7eb; }
        .module-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(16,42,67,0.1); border-color: #d4a853; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16,42,67,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-spinner { width: 48px; height: 48px; border: 3px solid rgba(212,168,83,0.2); border-top: 3px solid #d4a853; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .header-shadow { box-shadow: 0 1px 3px rgba(16,42,67,0.08); }
        .btn-primary { background: linear-gradient(135deg, #102a43 0%, #243b53 100%); color: white; }
        .btn-primary:hover { background: linear-gradient(135deg, #243b53 0%, #334e68 100%); }
        input:focus { outline: none; border-color: #d4a853 !important; box-shadow: 0 0 0 3px rgba(212,168,83,0.15) !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="text-center">
            <div class="loading-spinner mx-auto"></div>
            <p class="text-white mt-4 font-medium" id="loadingText">Loading...</p>
        </div>
    </div>

    <div id="app"></div>

    <script src="config.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        // API_URL loaded from config.js
        
        // ============================================
        // STATE
        // ============================================
        let isLoggedIn = false;
        let employeeEmail = '';
        let employeeData = null;
        let approvers = [];
        let isApprover = false;
        let pendingLeavesCount = 0;
        let pendingExpensesCount = 0;
        let taskCounts = { total: 0, pending: 0, overdue: 0 };

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function showLoading(text = 'Loading...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        async function callAPI(action, params = {}) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, ...params })
            });
            const result = await response.json();
            if (!result.success && result.error) {
                throw new Error(result.error);
            }
            return result.data !== undefined ? result.data : result;
        }

        // ============================================
        // SESSION MANAGEMENT
        // ============================================
        function saveSession() {
            const session = {
                employeeEmail: employeeEmail,
                employeeData: employeeData,
                isApprover: isApprover,
                timestamp: Date.now()
            };
            localStorage.setItem('timewise_session', JSON.stringify(session));
        }

        function loadSession() {
            try {
                const sessionStr = localStorage.getItem('timewise_session');
                if (!sessionStr) return null;
                
                const session = JSON.parse(sessionStr);
                
                // Check if session is expired (30 minutes)
                const sessionAge = Date.now() - session.timestamp;
                if (sessionAge > 30 * 60 * 1000) {
                    localStorage.removeItem('timewise_session');
                    return null;
                }
                
                return session;
            } catch (e) {
                return null;
            }
        }

        function clearSession() {
            localStorage.removeItem('timewise_session');
        }

        // ============================================
        // LOGIN
        // ============================================
        async function handleLogin() {
            const input = document.getElementById('emailInput');
            const statusDiv = document.getElementById('loginStatus');
            const loginBtn = document.getElementById('loginBtn');
            employeeEmail = input.value.trim().toLowerCase();

            if (!employeeEmail || !employeeEmail.includes('@')) {
                statusDiv.innerHTML = '<p class="text-red-600 text-sm mt-2">Please enter a valid email</p>';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = 'Logging in...';
            statusDiv.innerHTML = '<p class="text-blue-600 text-sm mt-2">⏳ Verifying...</p>';

            try {
                // Use initHome for single API call
                const initData = await callAPI('initHome', { email: employeeEmail });

                employeeData = initData.employee;
                isApprover = initData.isApprover;
                pendingLeavesCount = initData.pendingLeavesCount || 0;
                pendingExpensesCount = initData.pendingExpensesCount || 0;
                taskCounts = initData.taskCounts || { total: 0, pending: 0, overdue: 0 };

                isLoggedIn = true;
                saveSession();
                render();
            } catch (error) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
                statusDiv.innerHTML = `<p class="text-red-600 text-sm mt-2">❌ ${error.message}</p>`;
            }
        }

        function handleLogout() {
            clearSession();
            isLoggedIn = false;
            employeeEmail = '';
            employeeData = null;
            isApprover = false;
            pendingLeavesCount = 0;
            pendingExpensesCount = 0;
            taskCounts = { total: 0, pending: 0, overdue: 0 };
            render();
        }

        // ============================================
        // RENDER FUNCTIONS
        // ============================================
        function renderLogin() {
            return `
                <div class="min-h-screen flex">
                    <div class="hidden lg:flex lg:w-1/2 flex-col justify-between p-12" style="background:#102a43">
                        <div><img src="https://drpca.com/assets/drpca-logo.png" alt="DRP & Co. LLP" class="h-12 brightness-0 invert opacity-90" onerror="this.style.display='none'"></div>
                        <div class="text-white"><h1 class="text-4xl font-bold mb-4">TimeWise EMS</h1><p class="text-lg opacity-60">Employee Management System</p><p class="opacity-40 text-sm mt-1">[internal portal for DRPCA]</p></div>
                        <div class="text-white opacity-40 text-sm"><p>DRP & Co. LLP</p><p>Chartered Accountants • Wealth Managers • Valuation Professionals</p></div>
                    </div>
                    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
                        <div class="w-full max-w-md">
                            <div class="lg:hidden text-center mb-8"><img src="https://drpca.com/assets/drpca-logo.png" alt="DRP & Co." class="h-10 mx-auto mb-4" onerror="this.style.display='none'"></div>
                            <div class="text-center mb-8"><h2 class="text-2xl font-bold" style="color:#102a43">Welcome to TimeWise</h2><p class="text-gray-500 mt-2 text-sm">Sign in to continue</p></div>
                            <div class="space-y-5">
                                <div><label class="block text-sm font-medium mb-2" style="color:#243b53">Email Address</label><input type="email" id="emailInput" placeholder="your.name@drpca.com" class="w-full px-4 py-3 border border-gray-200 rounded-lg text-sm" onkeypress="if(event.key === 'Enter') handleLogin()" /></div>
                                <button id="loginBtn" onclick="handleLogin()" class="btn-primary w-full py-3 rounded-lg font-semibold text-sm">Sign In</button>
                                <div id="loginStatus"></div>
                            </div>
                            <div class="mt-12 pt-8 border-t border-gray-100"><p class="text-center text-gray-400 text-sm">© 2026 DRP & Co. LLP</p></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div class="min-h-screen bg-gray-50">
                    <!-- Header -->
                    <header class="bg-white header-shadow">
                        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex justify-between items-center h-16">
                                <div class="flex items-center space-x-4">
                                    <img src="https://drpca.com/assets/drpca-logo.png" alt="DRP & Co." class="h-12" onerror="this.outerHTML='<span class=\\'font-bold text-lg\\' style=\\'color:#102a43\\'>drp&co.</span>'">
                                    <div class="border-l border-gray-200 pl-4"><span class="font-semibold" style="color:#102a43">TimeWise EMS</span></div>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <div class="text-right"><p class="text-sm font-medium" style="color:#102a43">${employeeData['Employee Name']}</p><p class="text-xs text-gray-500">${employeeData['Designation'] || 'Employee'}</p></div>
                                    <button onclick="handleLogout()" class="text-sm text-gray-500 hover:text-gray-700 font-medium">Sign Out</button>
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <!-- Welcome Card -->
                        <div class="bg-white rounded-xl border border-gray-100 p-6 mb-8">
                            <h1 class="text-2xl font-bold mb-1" style="color:#102a43">Welcome back!</h1>
                            <p class="text-gray-500 text-sm">Select a module below to continue</p>
                        </div>

                        <!-- Module Cards -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            <!-- Timesheet Module -->
                            <a href="timesheet.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Timesheet</h2>
                                <p class="text-gray-500 text-sm">Log your daily work hours</p>
                            </a>

                            <!-- Work Plan Module (v3.5.0) -->
                            <a href="workplan.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2zM9 14l2 2 4-4"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Work Plan</h2>
                                <p class="text-gray-500 text-sm">Plan your next 30 days</p>
                            </a>

                            <!-- Leave Module -->
                            <a href="leave.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block relative">
                                ${isApprover && pendingLeavesCount > 0 ? `<div class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-semibold text-xs">${pendingLeavesCount}</div>` : ''}
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Leave</h2>
                                <p class="text-gray-500 text-sm">${isApprover && pendingLeavesCount > 0 ? `${pendingLeavesCount} pending approval` : 'Apply & check balance'}</p>
                            </a>

                            <!-- Expense Module -->
                            <a href="expenses.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block relative">
                                ${isApprover && pendingExpensesCount > 0 ? `<div class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-semibold text-xs">${pendingExpensesCount}</div>` : ''}
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Expenses</h2>
                                <p class="text-gray-500 text-sm">${isApprover && pendingExpensesCount > 0 ? `${pendingExpensesCount} pending approval` : 'Submit & track expenses'}</p>
                            </a>

                            <!-- Task Module -->
                            <a href="tasks.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block relative">
                                ${taskCounts.overdue > 0 ? `<div class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full flex items-center justify-center font-semibold text-xs">${taskCounts.overdue}</div>` : ''}
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Tasks</h2>
                                <p class="text-gray-500 text-sm">${taskCounts.overdue > 0 ? `${taskCounts.overdue} overdue` : taskCounts.pending > 0 ? `${taskCounts.pending} pending` : 'Manage assignments'}</p>
                            </a>

                            <!-- Retirement Corpus Discovery Module -->
                            <a href="retirement.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Retirement Planner</h2>
                                <p class="text-gray-500 text-sm">Discover your retirement corpus</p>
                            </a>

                            ${isApprover ? `
                            <!-- Reports Module (Approvers only) -->
                            <a href="dashboard.html" class="module-card bg-white rounded-xl p-6 cursor-pointer block">
                                <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4" style="background:#f0f4f8">
                                    <svg class="w-6 h-6" style="color:#102a43" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                                </div>
                                <h2 class="text-lg font-semibold mb-1" style="color:#102a43">Reports</h2>
                                <p class="text-gray-500 text-sm">Attendance, analytics &amp; MIS</p>
                            </a>
                            ` : ''}
                        </div>

                        <!-- Footer -->
                        <div class="text-center text-gray-400 text-sm mt-8 py-4">
                            TimeWise EMS v2.0 • © 2026 DRP & Co. LLP
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            document.getElementById('app').innerHTML = isLoggedIn ? renderDashboard() : renderLogin();
        }

        // ============================================
        // INITIALIZE
        // ============================================
        async function init() {
            const session = loadSession();
            if (session && session.employeeEmail && session.employeeData) {
                showLoading('Restoring session...');
                
                employeeEmail = session.employeeEmail;
                employeeData = session.employeeData;
                isApprover = session.isApprover || false;

                // v3.4.1 - Single initHome call replaces separate pending counts calls
                try {
                    const initData = await callAPI('initHome', { email: employeeEmail });
                    employeeData = initData.employee;
                    isApprover = initData.isApprover;
                    pendingLeavesCount = initData.pendingLeavesCount || 0;
                    pendingExpensesCount = initData.pendingExpensesCount || 0;
                    taskCounts = initData.taskCounts || { total: 0, pending: 0, overdue: 0 };
                } catch (e) {
                    pendingLeavesCount = 0;
                    pendingExpensesCount = 0;
                }

                isLoggedIn = true;
                saveSession(); // Refresh timestamp
                hideLoading();
                render();
            } else {
                render();
            }
        }

        init();
    </script>
</body>
</html>
