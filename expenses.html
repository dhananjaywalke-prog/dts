<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Expenses | TimeWise EMS</title>
    <!-- ============================================
    TimeWise EMS - Expenses Module
    Version: 2.0
    Last Updated: 15-Mar-2026
    UI: Redesigned with drpca.com branding
    Note: All JS logic preserved from original
    ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 700: '#334e68', 800: '#243b53', 900: '#102a43' },
                        gold: { 50: '#fdf9ef', 100: '#faf0d7', 400: '#e3b04a', 500: '#d4a853', 600: '#c4882c' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16,42,67,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-spinner { width: 48px; height: 48px; border: 3px solid rgba(212,168,83,0.2); border-top: 3px solid #d4a853; border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-spinner-lg { width: 64px; height: 64px; border: 4px solid rgba(212,168,83,0.2); border-top: 4px solid #d4a853; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-pending { background-color: #FEF3C7; color: #92400E; }
        .status-approved { background-color: #D1FAE5; color: #065F46; }
        .status-rejected { background-color: #FEE2E2; color: #991B1B; }
        .status-cancelled { background-color: #F3F4F6; color: #4B5563; }
        .edit-field { background-color: #fdf9ef; border: 2px solid #d4a853 !important; }
        .header-shadow { box-shadow: 0 1px 3px rgba(16,42,67,0.08); }
        .btn-primary { background: linear-gradient(135deg, #102a43 0%, #243b53 100%); color: white; }
        .btn-primary:hover { background: linear-gradient(135deg, #243b53 0%, #334e68 100%); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #d4a853 !important; box-shadow: 0 0 0 3px rgba(212,168,83,0.15) !important; }
        /* Searchable Dropdown */
        .searchable-dropdown { position: relative; width: 100%; }
        .searchable-dropdown .dd-display { width: 100%; padding: 8px 12px; padding-right: 32px; border: 1px solid #e5e7eb; border-radius: 8px; background: white; cursor: pointer; text-align: left; font-size: 14px; color: #102a43; position: relative; }
        .searchable-dropdown .dd-display:focus { outline: none; border-color: #d4a853; box-shadow: 0 0 0 3px rgba(212,168,83,0.15); }
        .searchable-dropdown .dd-display::after { content: ''; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 5px solid transparent; border-top-color: #6b7280; }
        .searchable-dropdown.open .dd-display::after { border-top-color: transparent; border-bottom-color: #6b7280; transform: translateY(-80%); }
        .searchable-dropdown .dd-panel { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 1000; display: none; max-height: 280px; overflow: hidden; }
        .searchable-dropdown.open .dd-panel { display: block; }
        .searchable-dropdown .dd-search { width: 100%; padding: 10px 12px; border: none; border-bottom: 1px solid #e5e7eb; font-size: 14px; outline: none; }
        .searchable-dropdown .dd-search:focus { background: #fdf9ef; }
        .searchable-dropdown .dd-options { max-height: 220px; overflow-y: auto; }
        .searchable-dropdown .dd-option { padding: 10px 12px; cursor: pointer; font-size: 14px; color: #374151; }
        .searchable-dropdown .dd-option:hover, .searchable-dropdown .dd-option.highlighted { background: #f0f4f8; }
        .searchable-dropdown .dd-option.selected { background: #fdf9ef; color: #102a43; font-weight: 500; }
        .searchable-dropdown .dd-option mark { background: #faf0d7; color: #102a43; padding: 0 2px; border-radius: 2px; }
        .searchable-dropdown .dd-empty { padding: 12px; text-align: center; color: #9ca3af; font-size: 13px; }
        .searchable-dropdown.field-error .dd-display { border-color: #EF4444 !important; }
        .searchable-dropdown.field-success .dd-display { border-color: #10B981 !important; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="text-center">
            <div class="loading-spinner mx-auto"></div>
            <p class="text-white mt-4 font-medium" id="loadingText">Processing...</p>
        </div>
    </div>
    <div id="app"></div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        let isLoggedIn = false, employeeEmail = '', employeeData = null;
        let expenseClientDropdownRef = null;
        let expenseTypes = [], clients = [], myExpenses = [], pendingExpenses = [], allExpenses = [];
        let expenseSummary = { pending: 0, approved: 0, rejected: 0 };
        let isApprover = false, editingExpense = null, editingApproval = null;

        function saveSession() { localStorage.setItem('timewise_session', JSON.stringify({ employeeEmail, employeeData, isApprover, timestamp: Date.now() })); }
        function loadSession() { try { const s = JSON.parse(localStorage.getItem('timewise_session')); if (s && (Date.now() - s.timestamp) < 30*60*1000) return s; localStorage.removeItem('timewise_session'); } catch(e){} return null; }
        function clearSession() {
            localStorage.removeItem('timewise_session');
            if (window.EMS2) { try { EMS2.signOut(); } catch (e) {} }
        }
        function showLoading(t = 'Processing...') { document.getElementById('loadingText').textContent = t; document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        async function callAPI(action, params = {}) {
            return window.EMS2.callAPI(action, params);
        }

        function formatDate(date) { if (!date) return ''; const d = new Date(date); if (isNaN(d.getTime())) return date; const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${d.getDate().toString().padStart(2,'0')}-${m[d.getMonth()]}-${d.getFullYear()}`; }
        function formatCurrency(a) { return '₹' + parseFloat(a || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 }); }
        function getStatusClass(s) { return { 'Pending': 'status-pending', 'Approved': 'status-approved', 'Rejected': 'status-rejected', 'Cancelled': 'status-cancelled' }[s] || 'status-cancelled'; }
        function canEditExpense(exp) { if (exp.Status !== 'Pending') return false; const d = new Date(exp.Date), today = new Date(), limit = new Date(today); limit.setDate(limit.getDate() - 7); return d >= limit; }

        async function handleLogin() {
            const input = document.getElementById('emailInput'), statusDiv = document.getElementById('loginStatus'), loginBtn = document.getElementById('loginBtn');
            employeeEmail = input.value.trim().toLowerCase();
            if (!employeeEmail || !employeeEmail.includes('@')) { statusDiv.innerHTML = '<p class="text-red-600 text-sm mt-2">Please enter a valid email</p>'; return; }
            loginBtn.disabled = true; loginBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Logging in...';
            try {
                const initData = await callAPI('initExpense', { email: employeeEmail });
                employeeData = initData.employee;
                isApprover = initData.isApprover;
                expenseTypes = initData.expenseTypes;
                clients = initData.clients.filter(c => c['Client Status'] === 'Active');
                expenseSummary = initData.summary;
                myExpenses = initData.expenses;
                pendingExpenses = initData.pendingExpenses || [];
                allExpenses = initData.allExpenses || [];
                isLoggedIn = true; saveSession(); render();
            } catch (error) { loginBtn.disabled = false; loginBtn.innerHTML = 'Login'; statusDiv.innerHTML = `<p class="text-red-600 text-sm mt-2">❌ ${error.message}</p>`; }
        }

        async function refreshData() {
            showLoading('Refreshing...');
            try {
                const initData = await callAPI('initExpense', { email: employeeEmail });
                expenseSummary = initData.summary;
                myExpenses = initData.expenses;
                pendingExpenses = initData.pendingExpenses || [];
                allExpenses = initData.allExpenses || [];
                hideLoading(); render();
            } catch (error) { hideLoading(); alert('Error refreshing: ' + error.message); }
        }

        function handleLogout() { clearSession(); isLoggedIn = false; employeeEmail = ''; employeeData = null; myExpenses = []; pendingExpenses = []; isApprover = false; editingExpense = null; editingApproval = null; render(); }

        async function handleSubmitExpense() {
            const date = document.getElementById('expenseDate')?.value, expenseType = document.getElementById('expenseType')?.value;
            const amount = document.getElementById('expenseAmount')?.value, description = document.getElementById('expenseDescription')?.value?.trim();
            const reimbursementBy = document.querySelector('input[name="reimbursementBy"]:checked')?.value;
            const clientName = expenseClientDropdownRef ? expenseClientDropdownRef.getValue() : '', receiptReference = document.getElementById('receiptReference')?.value?.trim();
            if (!date) { alert('Please select a date'); return; }
            if (!expenseType) { alert('Please select expense type'); return; }
            if (!amount || parseFloat(amount) <= 0) { alert('Please enter a valid amount'); return; }
            if (!description || description.length < 10) { alert('Description must be at least 10 characters'); return; }
            if (!reimbursementBy) { alert('Please select who will reimburse'); return; }
            if (reimbursementBy === 'Client' && !clientName) { alert('Please select a client'); return; }
            if (!receiptReference || receiptReference.length < 3) { alert('Receipt reference is required'); return; }
            showLoading(editingExpense ? 'Updating...' : 'Submitting...');
            try {
                if (editingExpense) {
                    await callAPI('updateExpense', { expense: { rowId: editingExpense['Row ID'], employeeEmail, date, expenseType, amount: parseFloat(amount), description, reimbursementBy, clientName, receiptReference } });
                } else {
                    await callAPI('submitExpense', { expense: { employeeEmail, employeeName: employeeData['Employee Name'], date, expenseType, amount: parseFloat(amount), description, reimbursementBy, clientName, receiptReference } });
                }
                const wasEditing = editingExpense; editingExpense = null;
                await refreshData();
                alert(wasEditing ? 'Expense updated!' : 'Expense submitted!');
            } catch (error) { hideLoading(); alert('Error: ' + error.message); }
        }

        function handleEditExpense(exp) { editingExpense = exp; render(); document.getElementById('expenseForm')?.scrollIntoView({ behavior: 'smooth' }); }
        function handleCancelEdit() { editingExpense = null; render(); }

        async function handleCancelExpense(rowId) {
            if (!confirm('Cancel this expense?')) return;
            showLoading('Cancelling...');
            try { await callAPI('cancelExpense', { rowId, email: employeeEmail }); await refreshData(); }
            catch (error) { hideLoading(); alert('Error: ' + error.message); }
        }

        function handleEditBeforeApproval(exp) { editingApproval = JSON.parse(JSON.stringify(exp)); render(); }
        function handleCancelApprovalEdit() { editingApproval = null; render(); }

        async function handleApproveExpense(rowId) {
            const comments = document.getElementById(`exp_comments_${rowId}`)?.value || '';
            let updates = null;
            if (editingApproval && editingApproval['Row ID'] === rowId) {
                const newExpenseType = document.getElementById(`edit_expType_${rowId}`)?.value;
                const newReimbursementBy = document.querySelector(`input[name="edit_reimburse_${rowId}"]:checked`)?.value;
                const newClientName = document.getElementById(`edit_client_${rowId}`)?.value || '';
                updates = { expenseType: newExpenseType, reimbursementBy: newReimbursementBy, clientName: newReimbursementBy === 'Client' ? newClientName : '' };
            }
            showLoading('Approving...');
            try { await callAPI('approveExpense', { rowId, approverEmail: employeeEmail, approverName: employeeData['Employee Name'], comments, updates }); editingApproval = null; await refreshData(); alert('Expense approved!'); }
            catch (error) { hideLoading(); alert('Error: ' + error.message); }
        }

        async function handleRejectExpense(rowId) {
            const comments = document.getElementById(`exp_comments_${rowId}`)?.value || '';
            if (!comments) { alert('Please provide a reason for rejection'); return; }
            if (!confirm('Reject this expense?')) return;
            showLoading('Rejecting...');
            try { await callAPI('rejectExpense', { rowId, approverEmail: employeeEmail, approverName: employeeData['Employee Name'], comments }); editingApproval = null; await refreshData(); }
            catch (error) { hideLoading(); alert('Error: ' + error.message); }
        }

        function handleReimbursementChange() { const r = document.querySelector('input[name="reimbursementBy"]:checked')?.value; const d = document.getElementById('clientSelectDiv'); if (d) d.style.display = r === 'Client' ? 'block' : 'none'; }
        function handleApprovalReimbursementChange(rowId) { const r = document.querySelector(`input[name="edit_reimburse_${rowId}"]:checked`)?.value; const d = document.getElementById(`edit_clientDiv_${rowId}`); if (d) d.style.display = r === 'Client' ? 'block' : 'none'; }

        function renderLogin() {
            window.location.replace('home.html');
            return '<div style="padding:60px;text-align:center;color:#486581;font-family:Inter,sans-serif">Redirecting to sign in…</div>';
        }

        function renderPendingExpenseCard(exp) {
            const isEditing = editingApproval && editingApproval['Row ID'] === exp['Row ID'];
            if (isEditing) {
                return `<div class="border-2 border-orange-400 rounded-lg p-4 bg-orange-50">
                    <div class="flex justify-between items-start mb-3">
                        <div><p class="font-bold text-lg">${exp['Employee Name']}</p><p class="text-sm text-gray-600">${exp['Employee Email']}</p></div>
                        <div class="text-right"><p class="text-2xl font-bold text-violet-600">${formatCurrency(exp.Amount)}</p><span class="bg-orange-500 text-white px-2 py-1 rounded-full text-xs font-semibold">✏️ Editing</span></div>
                    </div>
                    <div class="bg-white rounded-lg p-4 mb-3 space-y-3">
                        <p class="text-sm font-semibold text-orange-600">✏️ Edit before approval:</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-xs font-semibold text-gray-600 mb-1">Expense Type</label>
                                <select id="edit_expType_${exp['Row ID']}" class="w-full px-2 py-1 border-2 border-orange-300 rounded edit-field text-sm">
                                    ${expenseTypes.map(e => `<option value="${e['Expense Type']}" ${exp['Expense Type'] === e['Expense Type'] ? 'selected' : ''}>${e['Expense Type']}</option>`).join('')}
                                </select></div>
                            <div><label class="block text-xs font-semibold text-gray-600 mb-1">Date</label><p class="px-2 py-1 bg-gray-100 rounded text-sm">${formatDate(exp.Date)}</p></div>
                        </div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">Reimbursement By</label>
                            <div class="flex gap-2">
                                <label class="flex items-center px-3 py-1 border-2 border-orange-300 rounded edit-field cursor-pointer text-sm"><input type="radio" name="edit_reimburse_${exp['Row ID']}" value="DRP & Co. LLP" ${exp['Reimbursement By'] === 'DRP & Co. LLP' ? 'checked' : ''} onchange="handleApprovalReimbursementChange('${exp['Row ID']}')" class="mr-1"><span>DRP & Co. LLP</span></label>
                                <label class="flex items-center px-3 py-1 border-2 border-orange-300 rounded edit-field cursor-pointer text-sm"><input type="radio" name="edit_reimburse_${exp['Row ID']}" value="Client" ${exp['Reimbursement By'] === 'Client' ? 'checked' : ''} onchange="handleApprovalReimbursementChange('${exp['Row ID']}')" class="mr-1"><span>Client</span></label>
                            </div></div>
                        <div id="edit_clientDiv_${exp['Row ID']}" style="display: ${exp['Reimbursement By'] === 'Client' ? 'block' : 'none'}">
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Select Client</label>
                            <select id="edit_client_${exp['Row ID']}" class="w-full px-2 py-1 border-2 border-orange-300 rounded edit-field text-sm">
                                <option value="">-- Select --</option>
                                ${clients.filter(c => c['Client Short Name'] !== 'SELF').map(c => `<option value="${c['Client Full Name']}" ${exp['Client Name'] === c['Client Full Name'] ? 'selected' : ''}>${c['Client Full Name']}</option>`).join('')}
                            </select></div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">Description</label><p class="px-2 py-1 bg-gray-100 rounded text-sm">${exp.Description}</p></div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">Receipt</label><p class="px-2 py-1 bg-gray-100 rounded text-sm">${exp['Receipt Reference']}</p></div>
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="exp_comments_${exp['Row ID']}" placeholder="Comments (optional)" class="w-full px-3 py-2 border rounded-lg text-sm">
                        <div class="flex gap-2">
                            <button onclick="handleApproveExpense('${exp['Row ID']}')" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-semibold">✓ Approve with Changes</button>
                            <button onclick="handleCancelApprovalEdit()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 font-semibold">Cancel</button>
                        </div>
                    </div>
                </div>`;
            }
            return `<div class="border-2 border-yellow-100 rounded-lg p-4 bg-yellow-50">
                <div class="flex justify-between items-start mb-3">
                    <div><p class="font-bold text-lg">${exp['Employee Name']}</p><p class="text-sm text-gray-600">${exp['Employee Email']}</p></div>
                    <div class="text-right"><p class="text-2xl font-bold text-violet-600">${formatCurrency(exp.Amount)}</p><span class="status-pending px-2 py-1 rounded-full text-xs font-semibold">Pending</span></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm mb-3">
                    <div class="bg-white p-2 rounded"><span class="text-gray-500">Date:</span> <span class="font-semibold">${formatDate(exp.Date)}</span></div>
                    <div class="bg-white p-2 rounded"><span class="text-gray-500">Type:</span> <span class="font-semibold">${exp['Expense Type']}</span></div>
                    <div class="bg-white p-2 rounded"><span class="text-gray-500">Reimburse:</span> <span class="font-semibold">${exp['Reimbursement By']}</span></div>
                    <div class="bg-white p-2 rounded"><span class="text-gray-500">Receipt:</span> <span class="font-semibold">${exp['Receipt Reference']}</span></div>
                </div>
                ${exp['Client Name'] ? `<div class="bg-white p-2 rounded mb-3 text-sm"><span class="text-gray-500">Client:</span> <span class="font-semibold">${exp['Client Name']}</span></div>` : ''}
                <div class="bg-white p-2 rounded mb-3 text-sm"><span class="text-gray-500">Description:</span> ${exp.Description}</div>
                <div class="flex flex-col md:flex-row gap-2">
                    <input type="text" id="exp_comments_${exp['Row ID']}" placeholder="Comments (optional for approve, required for reject)" class="flex-1 px-3 py-2 border rounded-lg text-sm">
                    <button onclick="handleEditBeforeApproval(${JSON.stringify(exp).replace(/"/g, '&quot;')})" class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 font-semibold">✏️ Edit</button>
                    <button onclick="handleApproveExpense('${exp['Row ID']}')" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-semibold">✓ Approve</button>
                    <button onclick="handleRejectExpense('${exp['Row ID']}')" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-semibold">✗ Reject</button>
                </div>
            </div>`;
        }

        function renderApp() {
            const today = new Date().toISOString().split('T')[0];
            const minDate = new Date(); minDate.setDate(minDate.getDate() - 7);
            const minDateStr = minDate.toISOString().split('T')[0];
            const editDate = editingExpense?.Date ? (typeof editingExpense.Date === 'string' && editingExpense.Date.includes('/') ? '' : editingExpense.Date.split('T')[0]) : today;
            return `<div class="min-h-screen bg-gray-50">
                <header class="bg-white header-shadow sticky top-0 z-50">
                    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-16">
                            <div class="flex items-center space-x-4">
                                <img src="https://drpca.com/assets/drpca-logo.png" alt="DRP & Co." class="h-12" onerror="this.outerHTML='<span class=\\'font-bold text-lg\\' style=\\'color:#102a43\\'>drp&co.</span>'">
                                <div class="border-l border-gray-200 pl-4"><span class="font-semibold" style="color:#102a43">Expenses</span><span class="text-gray-400 text-sm ml-1">Module</span></div>
                            </div>
                            <div class="flex items-center space-x-6">
                                <div class="text-right"><p class="text-sm font-medium" style="color:#102a43">${employeeData['Employee Name']}</p><p class="text-xs text-gray-500">${employeeData['Designation'] || 'Employee'}</p></div>
                                <a href="home.html" class="flex items-center space-x-2 text-sm font-medium text-gray-600 hover:text-gray-900"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg><span>Back to Home</span></a>
                            </div>
                        </div>
                    </div>
                </header>
                <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white rounded-xl border border-gray-100 p-4 text-center"><p class="text-2xl font-bold text-yellow-600">${formatCurrency(expenseSummary.pending)}</p><p class="text-sm text-gray-500">Pending</p></div>
                        <div class="bg-white rounded-xl border border-gray-100 p-4 text-center"><p class="text-2xl font-bold text-green-600">${formatCurrency(expenseSummary.approved)}</p><p class="text-sm text-gray-500">Approved</p></div>
                        <div class="bg-white rounded-xl border border-gray-100 p-4 text-center"><p class="text-2xl font-bold text-red-600">${formatCurrency(expenseSummary.rejected)}</p><p class="text-sm text-gray-500">Rejected</p></div>
                        <div class="bg-white rounded-xl border border-gray-100 p-4 text-center"><p class="text-2xl font-bold" style="color:#102a43">${formatCurrency(expenseSummary.pending + expenseSummary.approved)}</p><p class="text-sm text-gray-500">Total Claims</p></div>
                    </div>
                    <div id="expenseForm" class="bg-white rounded-xl border border-gray-100 p-6">
                        <h2 class="text-lg font-semibold mb-4" style="color:#102a43">${editingExpense ? 'Edit Expense' : 'Submit New Expense'}</h2>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <div class="grid grid-cols-2 gap-4">
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Date *</label><input type="date" id="expenseDate" min="${minDateStr}" max="${today}" value="${editDate}" class="w-full px-3 py-2 border border-gray-200 rounded-lg"></div>
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹) *</label><input type="number" id="expenseAmount" min="1" step="0.01" placeholder="0.00" value="${editingExpense ? editingExpense.Amount : ''}" class="w-full px-3 py-2 border border-gray-200 rounded-lg"></div>
                                </div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Expense Type *</label>
                                    <select id="expenseType" class="w-full px-3 py-2 border border-gray-200 rounded-lg">
                                        <option value="">-- Select Type --</option>
                                        ${expenseTypes.map(e => `<option value="${e['Expense Type']}" ${editingExpense && editingExpense['Expense Type'] === e['Expense Type'] ? 'selected' : ''}>${e['Expense Type']}</option>`).join('')}
                                    </select></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-2">Reimbursement By *</label>
                                    <div class="flex gap-4">
                                        <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer flex-1"><input type="radio" name="reimbursementBy" value="DRP & Co. LLP" ${!editingExpense || editingExpense['Reimbursement By'] === 'DRP & Co. LLP' ? 'checked' : ''} onchange="handleReimbursementChange()" class="mr-2"><span>DRP & Co. LLP</span></label>
                                        <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 cursor-pointer flex-1"><input type="radio" name="reimbursementBy" value="Client" ${editingExpense && editingExpense['Reimbursement By'] === 'Client' ? 'checked' : ''} onchange="handleReimbursementChange()" class="mr-2"><span>Client</span></label>
                                    </div></div>
                                <div id="clientSelectDiv" style="display: ${editingExpense && editingExpense['Reimbursement By'] === 'Client' ? 'block' : 'none'}">
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Select Client *</label>
                                    <div id="expenseClientDropdown" class="searchable-dropdown"></div></div>
                            </div>
                            <div class="space-y-4">
                                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Description * <span class="font-normal text-gray-500">(min 10 chars)</span></label><textarea id="expenseDescription" rows="3" placeholder="Detailed description..." class="w-full px-3 py-2 border rounded-lg">${editingExpense ? editingExpense.Description : ''}</textarea></div>
                                <div><label class="block text-sm font-semibold text-gray-700 mb-1">Receipt Reference *</label><input type="text" id="receiptReference" placeholder="e.g., INV-2026-001" value="${editingExpense ? editingExpense['Receipt Reference'] : ''}" class="w-full px-3 py-2 border rounded-lg"></div>
                                <div class="flex gap-2">
                                    <button onclick="handleSubmitExpense()" class="flex-1 bg-violet-600 text-white py-3 rounded-lg hover:bg-violet-700 font-semibold">${editingExpense ? '💾 Update' : '📤 Submit'}</button>
                                    ${editingExpense ? `<button onclick="handleCancelEdit()" class="px-6 bg-gray-500 text-white py-3 rounded-lg hover:bg-gray-600 font-semibold">Cancel</button>` : ''}
                                </div>
                                <p class="text-xs text-gray-500">📅 Can submit expenses from last 7 days only</p>
                            </div>
                        </div>
                    </div>
                    ${isApprover && pendingExpenses.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-md p-6 border-2 border-yellow-200">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">⏳ Pending Approvals <span class="bg-yellow-500 text-white text-sm px-2 py-1 rounded-full ml-2">${pendingExpenses.length}</span></h2>
                        <div class="space-y-4">${pendingExpenses.map(exp => renderPendingExpenseCard(exp)).join('')}</div>
                    </div>` : ''}
                    <div class="bg-white rounded-xl shadow-md p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">📋 My Expenses</h2>
                        ${myExpenses.length === 0 ? `<div class="text-center py-8 text-gray-500"><div class="text-4xl mb-2">📭</div><p>No expenses yet</p></div>` : `
                            <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="text-left p-3">Date</th><th class="text-left p-3">Type</th><th class="text-right p-3">Amount</th><th class="text-left p-3">Reimburse</th><th class="text-left p-3">Status</th><th class="text-left p-3">Actions</th></tr></thead>
                            <tbody>${myExpenses.map(exp => `<tr class="border-b hover:bg-gray-50">
                                <td class="p-3 font-medium">${formatDate(exp.Date)}</td>
                                <td class="p-3">${exp['Expense Type']}</td>
                                <td class="p-3 text-right font-semibold">${formatCurrency(exp.Amount)}</td>
                                <td class="p-3">${exp['Reimbursement By']}${exp['Client Name'] ? `<br><span class="text-xs text-gray-500">${exp['Client Name']}</span>` : ''}</td>
                                <td class="p-3"><span class="${getStatusClass(exp.Status)} px-2 py-1 rounded-full text-xs font-semibold">${exp.Status}</span>${exp['Approver Name'] ? `<br><span class="text-xs text-gray-500">by ${exp['Approver Name']}</span>` : ''}</td>
                                <td class="p-3">${canEditExpense(exp) ? `<button onclick='handleEditExpense(${JSON.stringify(exp).replace(/'/g, "\\'")})' class="text-blue-600 hover:text-blue-800 text-xs font-semibold mr-2">Edit</button><button onclick="handleCancelExpense('${exp['Row ID']}')" class="text-red-600 hover:text-red-800 text-xs font-semibold">Cancel</button>` : '-'}</td>
                            </tr>`).join('')}</tbody></table></div>`}
                    </div>
                    ${isApprover && allExpenses.length > 0 ? `
                    <div class="bg-white rounded-xl shadow-md p-6">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">📊 All Expenses</h2>
                        <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="text-left p-3">Date</th><th class="text-left p-3">Employee</th><th class="text-left p-3">Type</th><th class="text-right p-3">Amount</th><th class="text-left p-3">Reimburse</th><th class="text-left p-3">Status</th></tr></thead>
                        <tbody>${allExpenses.slice(0, 50).map(exp => `<tr class="border-b hover:bg-gray-50">
                            <td class="p-3">${formatDate(exp.Date)}</td>
                            <td class="p-3"><span class="font-medium">${exp['Employee Name']}</span></td>
                            <td class="p-3">${exp['Expense Type']}</td>
                            <td class="p-3 text-right font-semibold">${formatCurrency(exp.Amount)}</td>
                            <td class="p-3">${exp['Reimbursement By']}${exp['Client Name'] ? `<br><span class="text-xs text-gray-500">${exp['Client Name']}</span>` : ''}</td>
                            <td class="p-3"><span class="${getStatusClass(exp.Status)} px-2 py-1 rounded-full text-xs font-semibold">${exp.Status}</span></td>
                        </tr>`).join('')}</tbody></table></div>
                        ${allExpenses.length > 50 ? `<p class="text-center text-gray-500 text-sm mt-4">Showing first 50</p>` : ''}
                    </div>` : ''}
                    <div class="text-center text-gray-400 text-sm py-4">TimeWise v3.2 | © 2026 DRP & Co. LLP</div>
                </div>
            </div>`;
        }

        function render() {
            document.getElementById('app').innerHTML = isLoggedIn ? renderApp() : renderLogin();
            if (isLoggedIn) setTimeout(() => initExpenseDropdowns(), 0);
        }

        function initExpenseDropdowns() {
            const clientList = clients.filter(c => c['Client Short Name'] !== 'SELF');
            expenseClientDropdownRef = initSearchableDropdown('expenseClientDropdown', clientList, {
                valueKey: 'Client Full Name',
                displayKey: 'Client Full Name',
                placeholder: '-- Select Client --'
            });
            // If editing, pre-select the saved client
            if (editingExpense && editingExpense['Reimbursement By'] === 'Client' && editingExpense['Client Name']) {
                if (expenseClientDropdownRef) expenseClientDropdownRef.setValue(editingExpense['Client Name']);
            }
        }

        // ============================================
        // SEARCHABLE DROPDOWN COMPONENT
        // ============================================
        function initSearchableDropdown(containerId, options, config = {}) {
            const container = document.getElementById(containerId);
            if (!container) return null;
            
            const valueKey = config.valueKey || 'value';
            const displayKey = config.displayKey || 'label';
            const placeholder = config.placeholder || 'Select...';
            const onChange = config.onChange || null;
            
            container.innerHTML = `
                <input type="hidden" id="${containerId}Value">
                <button type="button" class="dd-display" tabindex="0">${placeholder}</button>
                <div class="dd-panel">
                    <input type="text" class="dd-search" placeholder="Type to search..." autocomplete="off">
                    <div class="dd-options"></div>
                </div>
            `;
            
            const display = container.querySelector('.dd-display');
            const panel = container.querySelector('.dd-panel');
            const search = container.querySelector('.dd-search');
            const optionsList = container.querySelector('.dd-options');
            const hidden = container.querySelector('input[type="hidden"]');
            
            let currentOptions = options || [];
            let highlightedIndex = -1;
            let selectedValue = '';
            
            function getValue(item) {
                if (typeof item === 'string') return item;
                return item[valueKey] || item['name'] || item['Client Full Name'] || String(item);
            }
            
            function getDisplay(item) {
                if (typeof item === 'string') return item;
                return item[displayKey] || item['name'] || item['Client Full Name'] || String(item);
            }
            
            function escapeHtml(str) {
                return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }
            
            function renderOptions(filter = '') {
                const filterLower = filter.toLowerCase();
                let html = '';
                let visibleCount = 0;
                
                currentOptions.forEach((item) => {
                    const displayText = getDisplay(item);
                    const value = getValue(item);
                    
                    if (filter && !displayText.toLowerCase().includes(filterLower)) return;
                    
                    let highlighted = escapeHtml(displayText);
                    if (filter) {
                        const regex = new RegExp(`(${filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                        highlighted = escapeHtml(displayText).replace(regex, '<mark>$1</mark>');
                    }
                    
                    const isSelected = value === selectedValue;
                    html += `<div class="dd-option ${isSelected ? 'selected' : ''}" data-value="${escapeHtml(value)}" data-index="${visibleCount}">${highlighted}</div>`;
                    visibleCount++;
                });
                
                if (visibleCount === 0) html = '<div class="dd-empty">No matches found</div>';
                optionsList.innerHTML = html;
                highlightedIndex = -1;
            }
            
            function open() {
                container.classList.add('open');
                search.value = '';
                renderOptions();
                setTimeout(() => search.focus(), 10);
            }
            
            function close() {
                container.classList.remove('open');
                highlightedIndex = -1;
            }
            
            function selectOption(value, displayText) {
                selectedValue = value;
                hidden.value = value;
                display.textContent = displayText || value || placeholder;
                close();
                if (onChange) onChange(value);
            }
            
            display.addEventListener('click', (e) => { e.preventDefault(); container.classList.contains('open') ? close() : open(); });
            search.addEventListener('input', () => renderOptions(search.value));
            
            optionsList.addEventListener('click', (e) => {
                const option = e.target.closest('.dd-option');
                if (option) selectOption(option.dataset.value, option.textContent);
            });
            
            search.addEventListener('keydown', (e) => {
                const visibleOptions = optionsList.querySelectorAll('.dd-option');
                if (e.key === 'ArrowDown') { e.preventDefault(); highlightedIndex = Math.min(highlightedIndex + 1, visibleOptions.length - 1); updateHighlight(visibleOptions); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); highlightedIndex = Math.max(highlightedIndex - 1, 0); updateHighlight(visibleOptions); }
                else if (e.key === 'Enter') { e.preventDefault(); if (highlightedIndex >= 0 && visibleOptions[highlightedIndex]) selectOption(visibleOptions[highlightedIndex].dataset.value, visibleOptions[highlightedIndex].textContent); }
                else if (e.key === 'Escape') { close(); display.focus(); }
            });
            
            function updateHighlight(options) {
                options.forEach((opt, i) => { opt.classList.toggle('highlighted', i === highlightedIndex); if (i === highlightedIndex) opt.scrollIntoView({ block: 'nearest' }); });
            }
            
            document.addEventListener('click', (e) => { if (!container.contains(e.target)) close(); });
            
            container.setOptions = (newOptions) => { currentOptions = newOptions || []; renderOptions(); };
            container.setValue = (value) => { const item = currentOptions.find(o => getValue(o) === value); if (item) selectOption(value, getDisplay(item)); else selectOption('', ''); };
            container.getValue = () => hidden.value;
            container.clear = () => selectOption('', '');
            
            renderOptions();
            return container;
        }

        async function init() {
            const session = loadSession();
            if (session && session.employeeEmail && session.employeeData) {
                document.getElementById('app').innerHTML = `<div class="min-h-screen bg-gray-50 flex items-center justify-center"><div class="text-center"><div class="loading-spinner-lg mx-auto"></div><p class="text-gray-500 mt-5 text-sm font-medium">Loading your data...</p></div></div>`;
                try {
                    employeeEmail = session.employeeEmail; employeeData = session.employeeData; isApprover = session.isApprover || false;
                    const initData = await callAPI('initExpense', { email: employeeEmail });
                    expenseTypes = initData.expenseTypes;
                    clients = initData.clients.filter(c => c['Client Status'] === 'Active');
                    expenseSummary = initData.summary;
                    myExpenses = initData.expenses;
                    pendingExpenses = initData.pendingExpenses || [];
                    allExpenses = initData.allExpenses || [];
                    isApprover = initData.isApprover;
                    isLoggedIn = true; saveSession(); render();
                } catch (error) { console.error('Session error:', error); clearSession(); render(); }
            } else { render(); }
        }
        init();
    </script>
</body>
