<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Reports | TimeWise EMS</title>
    <!-- ============================================
    TimeWise EMS - Reports/MIS Module
    Version: 1.0
    Last Updated: 21-Apr-2026
    Access: Approvers only (enforced server-side + client-side)
    ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 50: '#f0f4f8', 100: '#d9e2ec', 200: '#bcccdc', 700: '#334e68', 800: '#243b53', 900: '#102a43' },
                        gold: { 50: '#fdf9ef', 100: '#faf0d7', 400: '#e3b04a', 500: '#d4a853', 600: '#c4882c' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(16,42,67,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .loading-spinner-lg { width: 64px; height: 64px; border: 4px solid rgba(212,168,83,0.2); border-top: 4px solid #d4a853; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .header-shadow { box-shadow: 0 1px 3px rgba(16,42,67,0.08); }
        .btn-primary { background: linear-gradient(135deg, #102a43 0%, #243b53 100%); color: white; }
        .btn-primary:hover { background: linear-gradient(135deg, #243b53 0%, #334e68 100%); }
        input:focus { outline: none; border-color: #d4a853 !important; box-shadow: 0 0 0 3px rgba(212,168,83,0.15) !important; }

        /* Report tabs */
        .report-tab { padding: 12px 20px; cursor: pointer; border-bottom: 3px solid transparent; color: #6b7280; font-weight: 500; white-space: nowrap; }
        .report-tab:hover { color: #102a43; }
        .report-tab.active { color: #102a43; border-bottom-color: #d4a853; font-weight: 600; }

        /* Attendance grid */
        .grid-wrap { overflow: auto; max-height: calc(100vh - 280px); border: 1px solid #e5e7eb; border-radius: 8px; background: white; }
        .attend-table { border-collapse: separate; border-spacing: 0; font-size: 12px; width: max-content; min-width: 100%; }
        .attend-table th, .attend-table td { border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; white-space: nowrap; }
        .attend-table thead th { position: sticky; top: 0; background: #102a43; color: white; font-weight: 600; z-index: 3; padding: 8px 6px; line-height: 1.3; }
        .attend-table thead th .dn { display: block; font-size: 10px; opacity: 0.75; font-weight: 400; }
        .attend-table thead th.weekend-head { background: #334e68; }
        .attend-table .sticky-col { position: sticky; left: 0; background: white; z-index: 2; text-align: left; padding: 8px 12px; font-weight: 500; color: #102a43; border-right: 2px solid #d4a853; }
        .attend-table thead th.sticky-col { background: #102a43; color: white; z-index: 4; }
        .attend-table .total-col { background: #fdf9ef; font-weight: 600; color: #102a43; border-left: 2px solid #d4a853; }
        .attend-table thead th.total-col { background: #c4882c; color: white; border-left: 2px solid #d4a853; }
        .attend-table tbody tr:hover td:not(.sticky-col):not(.total-col) { filter: brightness(0.96); }

        /* Cell color states */
        .cell-green { background: #d1fae5; color: #065f46; font-weight: 500; }
        .cell-yellow { background: #fef3c7; color: #92400e; font-weight: 500; }
        .cell-red { background: #fee2e2; color: #991b1b; font-weight: 700; }
        .cell-blue { background: #dbeafe; color: #1e40af; font-weight: 500; }
        .cell-grey { background: #f3f4f6; color: #9ca3af; }

        /* Legend */
        .legend-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 6px; border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="bg-gray-50">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="text-center">
            <div class="loading-spinner-lg mx-auto"></div>
            <p class="text-white mt-4 text-sm font-medium">Loading your data...</p>
        </div>
    </div>
    <div id="app"></div>

    <script src="config.js"></script>
    <script>
        let employeeEmail = '';
        let employeeData = null;
        let isApprover = false;
        let isLoggedIn = false;
        let attendanceData = null;
        let activeReport = 'attendance';

        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        async function callAPI(action, params = {}) {
            const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...params }) });
            const result = await r.json();
            if (!result.success && result.error) throw new Error(result.error);
            return result.data !== undefined ? result.data : result;
        }

        // ==================== SESSION ====================
        const SESSION_KEY = 'timewise_session';
        const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24 hours

        function saveSession() {
            const session = { employeeEmail, employeeData, isApprover, timestamp: Date.now() };
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }
        function loadSession() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                const s = JSON.parse(raw);
                if (!s.timestamp || (Date.now() - s.timestamp) > SESSION_DURATION) {
                    localStorage.removeItem(SESSION_KEY);
                    return null;
                }
                return s;
            } catch { return null; }
        }
        function clearSession() { localStorage.removeItem(SESSION_KEY); }

        function handleSignOut() { clearSession(); window.location.href = 'index.html'; }

        // ==================== LOGIN ====================
        async function handleLogin() {
            const input = document.getElementById('emailInput');
            const statusDiv = document.getElementById('loginStatus');
            const loginBtn = document.getElementById('loginBtn');
            employeeEmail = input.value.trim().toLowerCase();
            if (!employeeEmail || !employeeEmail.includes('@')) {
                statusDiv.innerHTML = '<p class="text-red-600 text-sm mt-2">Please enter a valid email</p>';
                return;
            }
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Logging in...';
            try {
                const initData = await callAPI('initDashboard', { email: employeeEmail });
                employeeData = initData.employee;
                isApprover = initData.isApprover;
                attendanceData = initData.attendance;
                isLoggedIn = true;
                saveSession();
                render();
            } catch (error) {
                statusDiv.innerHTML = `<p class="text-red-600 text-sm mt-2">❌ ${error.message}</p>`;
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        }

        async function refreshDashboard() {
            showLoading();
            try {
                const initData = await callAPI('initDashboard', { email: employeeEmail });
                attendanceData = initData.attendance;
                render();
            } catch (error) {
                alert('Failed to refresh: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // ==================== CELL COLOR LOGIC ====================
        function getCellClass(dateInfo, dayData, dateStr, todayStr) {
            // Grey for Sunday or Holiday
            if (dateInfo.isSunday || dateInfo.isHoliday) return 'cell-grey';

            const { workHours, leaveHours, totalHours } = dayData;

            // Red: zero hours (only within recent 7 days per business rule)
            if (totalHours === 0) {
                const daysDiff = Math.floor((new Date(todayStr) - new Date(dateStr)) / (1000 * 60 * 60 * 24));
                if (daysDiff <= 7) return 'cell-red';
                return 'cell-blue'; // Edge case: should have auto-filled
            }

            // Blue: pure leave day (all hours are leave/LOP/auto)
            if (leaveHours > 0 && workHours === 0) return 'cell-blue';

            // Green: full day (6+ hours, with at least some real work)
            if (totalHours >= 6) return 'cell-green';

            // Yellow: partial day (1-5 hours)
            return 'cell-yellow';
        }

        function formatCellValue(dateInfo, dayData) {
            const { totalHours } = dayData;
            if (totalHours === 0 && (dateInfo.isSunday || dateInfo.isHoliday)) return '-';
            if (totalHours === 0) return '0';
            // Remove trailing zeros (6 not 6.0)
            return totalHours % 1 === 0 ? String(totalHours) : totalHours.toFixed(2);
        }

        // ==================== RENDER ====================
        function render() {
            if (!isLoggedIn) return renderLogin();
            if (!isApprover) return renderAccessDenied();
            renderMain();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex">
                    <div class="hidden lg:flex lg:w-1/2 relative" style="background: linear-gradient(135deg, #102a43 0%, #243b53 100%);">
                        <div class="flex flex-col justify-between p-12 text-white w-full">
                            <div>
                                <div class="flex items-center gap-3 mb-16">
                                    <img src="drpca-logo.png" alt="drp&co." class="h-8">
                                </div>
                            </div>
                            <div>
                                <h1 class="text-4xl font-bold mb-4">Reports &amp; MIS</h1>
                                <p class="text-lg text-white/80 mb-8">Attendance dashboards, analytics and operational insights for approvers.</p>
                                <div class="flex items-center gap-6 text-sm text-white/60 pt-8 border-t border-white/10">
                                    <span>DRP &amp; Co. LLP</span>
                                    <span>•</span>
                                    <span>Approvers Only</span>
                                </div>
                            </div>
                            <div class="text-sm text-white/40">© 2026 DRP &amp; Co. LLP</div>
                        </div>
                    </div>
                    <div class="w-full lg:w-1/2 flex items-center justify-center p-6 bg-white">
                        <div class="w-full max-w-md">
                            <div class="mb-12"><img src="drpca-logo.png" alt="drp&co." class="h-8"></div>
                            <h2 class="text-3xl font-bold mb-2" style="color:#102a43">Reports Module</h2>
                            <p class="text-gray-500 mb-8">Sign in to view dashboards</p>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium mb-2" style="color:#102a43">Email Address</label>
                                    <input id="emailInput" type="email" placeholder="your.name@drpca.com" class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg" onkeypress="if(event.key==='Enter')handleLogin()">
                                </div>
                                <button id="loginBtn" onclick="handleLogin()" class="btn-primary w-full px-4 py-3 rounded-lg font-medium">Sign In</button>
                                <div id="loginStatus"></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            document.getElementById('emailInput').focus();
        }

        function renderAccessDenied() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <header class="bg-white header-shadow">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                            <div class="flex items-center gap-3"><img src="drpca-logo.png" alt="drp&co." class="h-8"></div>
                            <button onclick="handleSignOut()" class="text-sm text-gray-600 hover:text-navy-900">Sign Out</button>
                        </div>
                    </header>
                    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
                        <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center mb-6" style="background:#fee2e2">
                            <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                        </div>
                        <h1 class="text-2xl font-bold mb-2" style="color:#102a43">Access Denied</h1>
                        <p class="text-gray-500 mb-8">The Reports module is available only to approvers.</p>
                        <a href="home.html" class="btn-primary inline-block px-6 py-3 rounded-lg font-medium">Back to Home</a>
                    </main>
                </div>`;
        }

        function renderMain() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gray-50">
                    <header class="bg-white header-shadow sticky top-0 z-40">
                        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img src="drpca-logo.png" alt="drp&co." class="h-8">
                                <div class="h-6 w-px bg-gray-200 mx-2"></div>
                                <div>
                                    <h1 class="text-base font-semibold" style="color:#102a43">Reports &amp; MIS</h1>
                                    <p class="text-xs text-gray-500">Approvers dashboard</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right hidden sm:block">
                                    <p class="text-sm font-medium" style="color:#102a43">${employeeData['Employee Name'] || ''}</p>
                                    <p class="text-xs text-gray-500">${employeeData['Designation'] || ''}</p>
                                </div>
                                <a href="home.html" class="text-sm text-gray-600 hover:text-navy-900">← Back to Home</a>
                                <button onclick="handleSignOut()" class="text-sm text-gray-600 hover:text-navy-900">Sign Out</button>
                            </div>
                        </div>
                        <!-- Report Tabs -->
                        <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 flex gap-2 border-t border-gray-100 overflow-x-auto">
                            <div class="report-tab ${activeReport === 'attendance' ? 'active' : ''}" onclick="switchReport('attendance')">📊 Attendance Summary</div>
                            <!-- Future reports go here -->
                        </div>
                    </header>
                    <main class="max-w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        <div id="reportContent"></div>
                    </main>
                </div>`;

            renderActiveReport();
        }

        function switchReport(r) { activeReport = r; renderMain(); }

        function renderActiveReport() {
            const container = document.getElementById('reportContent');
            if (activeReport === 'attendance') container.innerHTML = buildAttendanceHTML();
        }

        function buildAttendanceHTML() {
            if (!attendanceData || !attendanceData.dates || !attendanceData.employees.length) {
                return `<div class="bg-white rounded-xl p-8 text-center text-gray-500 border border-gray-200">No attendance data available.</div>`;
            }

            const { dates, employees } = attendanceData;
            const todayStr = dates[dates.length - 1].dateStr;

            // Column headers
            const dateHeaders = dates.map(d => {
                const weekendCls = (d.isSunday || d.isHoliday) ? 'weekend-head' : '';
                return `<th class="${weekendCls}" title="${d.dateStr}${d.isHoliday ? ' (Holiday)' : ''}">${d.dayNum}<span class="dn">${d.dayName}</span></th>`;
            }).join('');

            // Body rows
            const rows = employees.map(emp => {
                const cells = emp.days.map((day, i) => {
                    const dateInfo = dates[i];
                    const cls = getCellClass(dateInfo, day, dateInfo.dateStr, todayStr);
                    const val = formatCellValue(dateInfo, day);
                    const tooltip = `${emp.name} • ${dateInfo.dateStr}\nWork: ${day.workHours} | Leave: ${day.leaveHours} | Total: ${day.totalHours}`;
                    return `<td class="${cls}" title="${tooltip}">${val}</td>`;
                }).join('');

                return `<tr>
                    <td class="sticky-col">${emp.name}</td>
                    ${cells}
                    <td class="total-col">${emp.totalWorkHours}</td>
                    <td class="total-col">${emp.totalLeaveHours}</td>
                    <td class="total-col">${emp.workingDays}</td>
                </tr>`;
            }).join('');

            const monthLabel = `${dates[0].dayNum} ${dates[0].monthShort} – ${dates[dates.length-1].dayNum} ${dates[dates.length-1].monthShort}`;

            return `
                <!-- Report header -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
                    <div>
                        <h2 class="text-xl font-bold" style="color:#102a43">Attendance Summary</h2>
                        <p class="text-sm text-gray-500">Last 30 days: ${monthLabel} • ${employees.length} active employees</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="refreshDashboard()" class="px-4 py-2 text-sm font-medium rounded-lg border border-gray-200 bg-white hover:bg-gray-50" style="color:#102a43">
                            🔄 Refresh
                        </button>
                        <button onclick="exportAttendanceCSV()" class="btn-primary px-4 py-2 text-sm font-medium rounded-lg">
                            ⬇ Export CSV
                        </button>
                    </div>
                </div>

                <!-- Legend -->
                <div class="bg-white border border-gray-200 rounded-lg p-3 mb-4 flex flex-wrap gap-4 text-xs text-gray-700">
                    <span><span class="legend-swatch" style="background:#d1fae5"></span>6+ hrs (full day)</span>
                    <span><span class="legend-swatch" style="background:#fef3c7"></span>1-5 hrs (partial)</span>
                    <span><span class="legend-swatch" style="background:#fee2e2"></span>0 hrs (absent, recent 7 days)</span>
                    <span><span class="legend-swatch" style="background:#dbeafe"></span>Leave / LOP / Auto-leave</span>
                    <span><span class="legend-swatch" style="background:#f3f4f6"></span>Sunday / Holiday</span>
                </div>

                <!-- Grid -->
                <div class="grid-wrap">
                    <table class="attend-table">
                        <thead>
                            <tr>
                                <th class="sticky-col" style="text-align:left;">Employee</th>
                                ${dateHeaders}
                                <th class="total-col" title="Total Work Hours">Work</th>
                                <th class="total-col" title="Total Leave/LOP/Idle Hours">Leave</th>
                                <th class="total-col" title="Days with any work hours logged">Days</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 mt-3">Hover any cell for detailed breakdown. Data refreshes on page load and when you click Refresh.</p>`;
        }

        // ==================== CSV EXPORT ====================
        function exportAttendanceCSV() {
            if (!attendanceData) return;
            const { dates, employees } = attendanceData;

            // Header row
            const header = ['Employee', ...dates.map(d => `${d.dayNum}-${d.monthShort}-${d.dayName}`), 'Total Work Hours', 'Total Leave Hours', 'Working Days'];

            const csvRows = [header.join(',')];
            employees.forEach(emp => {
                const row = [`"${(emp.name || '').replace(/"/g,'""')}"`];
                emp.days.forEach(d => row.push(d.totalHours));
                row.push(emp.totalWorkHours);
                row.push(emp.totalLeaveHours);
                row.push(emp.workingDays);
                csvRows.push(row.join(','));
            });

            const csv = csvRows.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const today = new Date();
            const stamp = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
            a.download = `Attendance_Summary_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ==================== INIT ====================
        async function init() {
            const session = loadSession();
            if (session && session.employeeEmail) {
                employeeEmail = session.employeeEmail;
                employeeData = session.employeeData;
                isApprover = session.isApprover;

                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen bg-gray-50 flex items-center justify-center">
                        <div class="text-center">
                            <div class="loading-spinner-lg mx-auto"></div>
                            <p class="mt-4 text-gray-500 text-sm">Loading dashboard...</p>
                        </div>
                    </div>`;

                try {
                    const initData = await callAPI('initDashboard', { email: employeeEmail });
                    employeeData = initData.employee;
                    isApprover = initData.isApprover;
                    attendanceData = initData.attendance;
                    isLoggedIn = true;
                    saveSession();
                    render();
                } catch (error) {
                    // If access denied (non-approver session), show access denied instead of clearing
                    if (String(error.message).toLowerCase().includes('access denied')) {
                        isLoggedIn = true;
                        isApprover = false;
                        render();
                    } else {
                        clearSession();
                        render();
                    }
                }
            } else {
                render();
            }
        }

        init();
    </script>
</body>
</html>
